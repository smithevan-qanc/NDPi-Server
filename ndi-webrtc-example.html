<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NDI Monitor - WebRTC</title>
  <style>
    html, body { height: 100%; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #000;
      color: #eee;
    }
    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #videoWrap {
      flex: 1;
      min-height: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .overlay-info {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      line-height: 1.4;
      display: none;
    }
    .overlay-info.active { display: block; }

    /* Right-side slide-out menu */
    .menuHotZone {
      position: fixed;
      top: 0;
      right: 0;
      width: 28px;
      height: 100vh;
      z-index: 20;
    }
    .menu {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: 320px;
      max-width: calc(100vw - 12px);
      z-index: 30;
      background: rgba(0, 0, 0, 0.86);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      transform: translateX(100%);
      transition: transform 120ms ease-out;
      display: flex;
      flex-direction: column;
      padding: 16px;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
      overflow-y: auto;
    }
    .menu.open { transform: translateX(0); }
    .menuHeader {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .title { font-size: 16px; font-weight: 600; margin: 0; }
    .hint { font-size: 12px; color: #aaa; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 12px; color: #bbb; margin-bottom: 4px; }
    select, button {
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.06);
      color: #eee;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      font-size: 12px;
    }
    select {
      background: #fff;
      color: #000;
    }
    select option {
      color: #000;
      background: #fff;
    }
    button { cursor: pointer; }
    button:hover { background: rgba(255, 255, 255, 0.10); }
    button:active { background: rgba(255, 255, 255, 0.15); }
    #status { 
      margin-top: 16px; 
      color: #bbb; 
      font-size: 12px; 
      line-height: 1.3;
      padding: 8px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 4px;
    }

    .rangeRow { display: flex; align-items: center; gap: 10px; }
    input[type="range"] { flex: 1; }
    .mono { 
      font-variant-numeric: tabular-nums; 
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; 
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 12px 0;
    }

    .stats {
      font-size: 11px;
      color: #aaa;
      word-break: break-all;
    }
    .stat-item {
      display: flex;
      gap: 8px;
      margin-bottom: 4px;
    }
    .stat-label { min-width: 60px; }
  </style>
</head>
<body>
  <div class="app">
    <div id="videoWrap">
      <img id="mjpeg" alt="NDI video" style="width: 100%; height: 100%; display: block; background: #000; object-fit: contain;" />
      <div id="overlayInfo" class="overlay-info"></div>
    </div>
  </div>

  <div class="menuHotZone" id="menuHotZone" aria-hidden="true"></div>

  <aside class="menu" id="menu" aria-label="NDI settings">
    <div class="menuHeader">
      <h1 class="title">NDI Monitor</h1>
      <div class="hint">Hover right edge</div>
    </div>

    <div class="col">
      <!-- Source Selection -->
      <div>
        <label for="sourceSelect">Source</label>
        <div class="row">
          <select id="sourceSelect"></select>
          <button id="refreshBtn" type="button" title="Refresh source list">⟳</button>
        </div>
      </div>

      <!-- Start/Stop Stream -->
      <div>
        <button id="monitorBtn" type="button" style="width: 100%; padding: 8px; font-weight: 600;">Start Monitor</button>
      </div>

      <!-- Object Fit -->
      <div>
        <label for="fitSelect">Object fit</label>
        <div class="row">
          <select id="fitSelect">
            <option value="contain">Contain</option>
            <option value="cover">Cover</option>
            <option value="fill">Fill</option>
          </select>
        </div>
      </div>

      <!-- Show Stats -->
      <div>
        <label>
          <input type="checkbox" id="showStats" /> Show stats overlay
        </label>
      </div>

      <div class="divider"></div>

      <!-- Stream Info -->
      <div class="stats">
        <div class="stat-item">
          <span class="stat-label">Status:</span>
          <span id="streamStatus">idle</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">FPS:</span>
          <span id="streamFPS">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Clients:</span>
          <span id="streamClients">0</span>
        </div>
      </div>

      <div id="status">Ready to monitor</div>
    </div>
  </aside>

<script>
  const LS_KEY = 'ndi.selectedSourceName';
  const LS_FIT = 'ndi.objectFit';
  const LS_SHOW_STATS = 'ndi.showStats';

  const statusEl = document.getElementById('status');
  const selectEl = document.getElementById('sourceSelect');
  const refreshBtn = document.getElementById('refreshBtn');
  const monitorBtn = document.getElementById('monitorBtn');
  const imgEl = document.getElementById('mjpeg');
  const fitSelectEl = document.getElementById('fitSelect');
  const showStatsCheckbox = document.getElementById('showStats');
  const overlayEl = document.getElementById('overlayInfo');
  const menuEl = document.getElementById('menu');
  const menuHotZoneEl = document.getElementById('menuHotZone');

  let currentStreamId = null;
  let currentWs = null;
  let pollTimer = null;
  let statsInterval = null;

  function setStatus(msg) { 
    statusEl.textContent = msg; 
  }

  function setStreamStatus(status, clients = 0, fps = 0) {
    document.getElementById('streamStatus').textContent = status;
    document.getElementById('streamClients').textContent = String(clients);
    document.getElementById('streamFPS').textContent = String(fps);
  }

  async function fetchSources() {
    try {
      const r = await fetch('/api/v1/ndi-sources');
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      // Handle both formats: { sources: [...] } and bare array
      return Array.isArray(data) ? data : (data.sources || []);
    } catch (e) {
      console.error('Error fetching sources:', e);
      return [];
    }
  }

  function setOptions(sources, preferred) {
    selectEl.innerHTML = '';
    const empty = document.createElement('option');
    empty.value = '';
    empty.textContent = '-- select --';
    selectEl.appendChild(empty);

    for (const source of sources) {
      const o = document.createElement('option');
      // Handle both string sources and object sources with .name property
      const sourceStr = typeof source === 'string' ? source : source.name;
      o.value = sourceStr;
      o.textContent = sourceStr;
      selectEl.appendChild(o);
    }

    if (preferred) {
      const match = sources.find(s => {
        const sourceStr = typeof s === 'string' ? s : s.name;
        return sourceStr === preferred;
      });
      if (match) {
        selectEl.value = preferred;
      }
    }
  }

  async function stopStream() {
    if (!currentStreamId) return;

    try {
      // Close WebSocket if open
      if (currentWs) {
        currentWs.close();
        currentWs = null;
      }

      // Stop stream on server
      await fetch('/api/v1/ndi-stream/stop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ streamId: currentStreamId })
      });

      // Clear image
      imgEl.src = '';
      
      currentStreamId = null;
      setStreamStatus('stopped');
      setStatus('Stream stopped');
      updateMonitorButton();
    } catch (e) {
      console.error('Error stopping stream:', e);
      setStatus(`Stop error: ${e.message}`);
    }
  }

  async function startStream(sourceName) {
    if (!sourceName) {
      setStatus('Select a source first');
      return;
    }

    setStatus(`Starting stream for: ${sourceName}`);
    setStreamStatus('starting');

    try {
      // Request stream start from server
      const startRes = await fetch('/api/v1/ndi-stream/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ndiSource: sourceName })
      });

      if (!startRes.ok) {
        throw new Error(`Server error: ${await startRes.text()}`);
      }

      const startData = await startRes.json();
      currentStreamId = startData.streamId;

      localStorage.setItem(LS_KEY, sourceName);

      // Set image source to MJPEG stream
      imgEl.src = `/api/v1/ndi-stream/${currentStreamId}/mjpeg?t=${Date.now()}`;

      // Connect WebSocket for stats
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws/ndi-stream/${currentStreamId}`;
      
      currentWs = new WebSocket(wsUrl);
      
      currentWs.onopen = () => {
        console.log('WebSocket connected');
        setStreamStatus('connected');
        setStatus(`Monitoring: ${sourceName}`);
      };

      currentWs.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'status') {
            setStreamStatus('streaming', data.clientCount, data.frameCount);
          }
        } catch (e) {
          console.error('Error handling WebSocket message:', e);
        }
      };

      currentWs.onerror = (error) => {
        console.error('WebSocket error:', error);
        setStatus(`Stream error: ${error.message}`);
        setStreamStatus('error');
      };

      currentWs.onclose = () => {
        console.log('WebSocket closed');
        if (currentStreamId) {
          setStatus('Stream disconnected - attempting reconnect...');
          setStreamStatus('disconnected');
        }
      };

      updateMonitorButton();
    } catch (e) {
      console.error('Error starting stream:', e);
      setStatus(`Start error: ${e.message}`);
      setStreamStatus('error');
      currentStreamId = null;
      updateMonitorButton();
    }
  }

  function updateMonitorButton() {
    if (currentStreamId) {
      monitorBtn.textContent = 'Stop Monitor';
      monitorBtn.style.background = 'rgba(200, 50, 50, 0.3)';
    } else {
      monitorBtn.textContent = 'Start Monitor';
      monitorBtn.style.background = 'rgba(255, 255, 255, 0.06)';
    }
  }

  refreshBtn.addEventListener('click', async () => {
    const cached = localStorage.getItem(LS_KEY) || '';
    const sources = await fetchSources();
    setOptions(sources, cached);
    setStatus(`Found ${sources.length} source(s)`);
  });

  monitorBtn.addEventListener('click', async () => {
    if (currentStreamId) {
      await stopStream();
    } else {
      const name = selectEl.value;
      if (!name) {
        setStatus('Select a source first');
        return;
      }
      await startStream(name);
    }
  });

  // Object-fit selection
  fitSelectEl.addEventListener('change', () => {
    const v = fitSelectEl.value || 'contain';
    localStorage.setItem(LS_FIT, v);
    videoEl.style.objectFit = v;
  });

  // Show stats overlay
  showStatsCheckbox.addEventListener('change', () => {
    const shouldShow = showStatsCheckbox.checked;
    localStorage.setItem(LS_SHOW_STATS, shouldShow ? 'true' : 'false');
    overlayEl.classList.toggle('active', shouldShow);
  });

  // Right-side hover-to-open menu
  function setMenuOpen(open) {
    menuEl.classList.toggle('open', !!open);
  }
  const MENU_OPEN_DELAY_MS = 500;
  let menuOpenTimer = null;
  const MENU_CLOSE_DELAY_MS = 2000;
  let menuCloseTimer = null;

  function scheduleMenuOpen() {
    if (menuEl.classList.contains('open')) return;
    if (menuOpenTimer) return;
    menuOpenTimer = setTimeout(() => {
      menuOpenTimer = null;
      setMenuOpen(true);
    }, MENU_OPEN_DELAY_MS);
  }

  function cancelScheduledOpen() {
    if (menuOpenTimer) {
      clearTimeout(menuOpenTimer);
      menuOpenTimer = null;
    }
  }

  function scheduleMenuClose() {
    if (!menuEl.classList.contains('open')) return;
    if (menuCloseTimer) return;
    menuCloseTimer = setTimeout(() => {
      menuCloseTimer = null;
      setMenuOpen(false);
    }, MENU_CLOSE_DELAY_MS);
  }

  function cancelScheduledClose() {
    if (menuCloseTimer) {
      clearTimeout(menuCloseTimer);
      menuCloseTimer = null;
    }
  }

  document.addEventListener('mousemove', (e) => {
    const threshold = 36;
    if (e.clientX >= window.innerWidth - threshold) {
      cancelScheduledClose();
      scheduleMenuOpen();
    } else if (!menuEl.matches(':hover') && e.clientX < window.innerWidth - 360) {
      cancelScheduledOpen();
      scheduleMenuClose();
    }
  });

  menuHotZoneEl.addEventListener('mouseenter', () => {
    cancelScheduledClose();
    scheduleMenuOpen();
  });

  menuHotZoneEl.addEventListener('mouseleave', () => {
    cancelScheduledOpen();
    scheduleMenuClose();
  });

  menuEl.addEventListener('mouseenter', () => cancelScheduledClose());
  menuEl.addEventListener('mouseleave', () => {
    cancelScheduledOpen();
    scheduleMenuClose();
  });

  // Stats overlay updater
  function updateStatsOverlay() {
    if (!showStatsCheckbox.checked) return;
    
    const status = document.getElementById('streamStatus').textContent;
    const fps = document.getElementById('streamFPS').textContent;
    const clients = document.getElementById('streamClients').textContent;
    const source = selectEl.value || 'none';

    overlayEl.innerHTML = `
Source: ${source}<br/>
Status: ${status}<br/>
FPS: ${fps} | Clients: ${clients}
    `;
  }

  // Initial load
  (async () => {
    // Restore preferences
    const cachedFit = localStorage.getItem(LS_FIT) || 'contain';
    const cachedSource = localStorage.getItem(LS_KEY) || '';
    const cachedShowStats = localStorage.getItem(LS_SHOW_STATS) === 'true';

    fitSelectEl.value = cachedFit;
    imgEl.style.objectFit = cachedFit;
    
    showStatsCheckbox.checked = cachedShowStats;
    overlayEl.classList.toggle('active', cachedShowStats);

    // Fetch and display sources
    const sources = await fetchSources();
    setOptions(sources, cachedSource);

    // Poll for cached source and auto-start
    if (cachedSource) {
      setStatus(`Looking for cached source: ${cachedSource}`);
      
      const tick = async () => {
        const currentCached = localStorage.getItem(LS_KEY) || '';
        if (!currentCached) {
          pollTimer = null;
          return;
        }

        try {
          const sourcesNow = await fetchSources();
          setOptions(sourcesNow, currentCached);

          if (sourcesNow.find(s => s.name === currentCached)) {
            await startStream(currentCached);
            return;
          }
        } catch (e) {
          // keep trying
        }
        pollTimer = setTimeout(tick, 1000);
      };

      await tick();
    } else {
      setStatus('Choose a source to monitor');
    }

    // Update stats overlay periodically
    statsInterval = setInterval(updateStatsOverlay, 100);
  })();
</script>
</body>
</html>
