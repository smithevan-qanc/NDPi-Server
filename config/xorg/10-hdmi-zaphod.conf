# Splits the Hub's single Xorg process (the one LightDM already starts on
# :0 for the kiosk dashboard, see ../lightdm/lightdm-autologin.conf) into
# two independent "Zaphod mode" screens, one per physical HDMI connector:
#
#   :0.0 (Screen 0) -> HDMI-1 -> the Hub's kiosk dashboard (unchanged)
#   :0.1 (Screen 1) -> HDMI-2 -> the AirPlay-to-NDI mirror
#       (see ../systemd/uxplay-airplay.service / uxplay-ndi-sender.service,
#       which target DISPLAY=:0.1)
#
# This is the standard/documented way to drive two independent outputs
# from one GPU with completely independent content on each (as opposed to
# a spanned/extended desktop) -- it keeps everything under ONE Xorg
# process/DRM master, which is far more likely to actually work on the
# Pi's vc4-kms-v3d driver than trying to run two separate competing Xorg
# processes against the same DRM device. Requires `max_framebuffers=2` in
# config/boot_config/config.txt (bumped from 1 as part of this same
# change) so the KMS driver actually exposes two independent CRTCs/
# pipelines to X in the first place.
#
# xorg.conf.d drop-ins are picked up automatically by any Xorg process on
# next start -- LightDM does not need to be reconfigured, but its Xorg
# process (and therefore the kiosk dashboard on :0.0) DOES need to be
# restarted once for this to take effect (`sudo systemctl restart
# lightdm`, or a full reboot -- recommended, since `max_framebuffers` also
# requires one).
#
# ⚠️ UNVERIFIED: this file was authored by reasoning about the documented
# Zaphod-mode recipe for the X.Org `modesetting` driver, not tested against
# real Raspberry Pi hardware (no X11/DRM available in the dev environment
# this was written in). The connector names ("HDMI-1"/"HDMI-2") and DRM
# device path ("/dev/dri/card1") match what the rest of this repo's own
# scripts already assume for this hardware (see sh/current-resolution) --
# verify both against `xrandr --listproviders` / `ls /dev/dri` on the
# actual device if X fails to start after deploying this file, and check
# `journalctl -u lightdm` / `Xorg.0.log` for the specific error.

Section "ServerLayout"
    Identifier "HDMI-Zaphod-Layout"
    Screen 0 "Screen-HDMI1" 0 0
    Screen 1 "Screen-HDMI2" 0 0
    Option "Xinerama" "off"
EndSection

Section "Device"
    Identifier "Device-HDMI1"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card1"
    Option "ZaphodHeads" "HDMI-1"
EndSection

Section "Device"
    Identifier "Device-HDMI2"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card1"
    Option "ZaphodHeads" "HDMI-2"
EndSection

Section "Screen"
    Identifier "Screen-HDMI1"
    Device "Device-HDMI1"
EndSection

Section "Screen"
    Identifier "Screen-HDMI2"
    Device "Device-HDMI2"
EndSection
