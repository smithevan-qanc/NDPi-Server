<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="/styles.css">
	<script src="/scripts/auth.js"></script>
	<script src="/scripts/ws-client.js"></script>
	<script src="/scripts/ws-devices.js"></script>
	<script src="/scripts/modal.js"></script>
	<script src="/scripts/screen-saver.js"></script>
	<title>Devices | NDPi Monitor</title>
	<link rel="icon" type="image/svg+xml" href="/media/favicon.svg">
</head>
<body class="hide-scrollbar">
	<div id="wallpaper"></div>
	<div id="main-div" class="app">
		<div class="topbar">
			<div class="topbar-spacer"></div>
			<!--button onclick="window.location.href='/account-settings.html'" class="button-logged-in-acct">
				<span id="navAccount"></span>
			</button-->
			<div onclick="window.location.href='/'" class="topbar-logo" id="topbarLogo"></div>
		</div>

		<div class="bottombar">
			<div class="bottombar-nav">
				<button id="navDashboard" class="nav-btn"></button>
				<button id="navDevices" class="nav-btn"></button>
				<button id="navGroups" class="nav-btn"></button>
				<button id="navSettings" class="nav-btn"></button>
				<button id="navAccount" class="nav-btn"></button>
			</div>
		</div>

		<section class="dashboard">
			<div class="card" style="grid-column: 1 / -1;">
				<h2>Device Management</h2>
				<div class="card-content" style="display: flex; flex-direction: column; gap: 16px;">

					<!-- Online Devices -->
					<div class="device-section online" id="onlineSection" style="display: none;">
						<h3>Online Devices</h3>
						<div class="devices-grid" id="onlineDevices"></div>
					</div>

					<!-- Discovered Devices -->
					<div class="device-section discovered" id="discoveredSection" style="display: none;">
						<h3>Discovered Devices (Click to Add)</h3>
						<div class="devices-grid" id="discoveredDevices"></div>
					</div>

					<!-- Offline Devices -->
					<div class="device-section offline" id="offlineSection" style="display: none;">
						<h3>Offline Devices</h3>
						<div class="devices-grid" id="offlineDevices"></div>
					</div>

					<!-- No Devices Message -->
					<div id="noDevicesMessage" style="text-align: center; padding: 40px; color: #888;">
						<p>No devices found</p>
						<p style="font-size: 14px; margin-top: 8px;">Click "Add Device" to discover and add new devices</p>
					</div>

				</div>
			</div>
		</section>

		<!-- Floating Action Button -->
		<div class="floating-actions">
			<button class="fab" id="add-button" title="Add Device">
				<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-lg" viewBox="0 0 16 16">
					<path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/>
				</svg>
			</button>
		</div>
	</div>
	<script src="/scripts/functions.js"></script>
	<script>

		(() => {
			applyActiveNav('navDevices');
		})();

		// Global variables
		let devices = [];
		let groups = [];
		let activeViewers = [];

		document.getElementById('add-button').addEventListener('click', () => {
			this.onclick = null;
			window.location.href='/device-discovery.html'
		});

		// Show offline overlay
		function showOfflineOverlay() {
			document.getElementById('offlineOverlay').style.display = 'block';
		}

		// Hide offline overlay
		function hideOfflineOverlay() {
			document.getElementById('offlineOverlay').style.display = 'none';
		}

		// Fetch Devices and Discovered Devices
		async function fetchDevices() {
			try {
				// Fetch both saved devices and discovered devices
				const [devicesRes, discoveredRes] = await Promise.all([
					fetch('/api/devices'),
					fetch('/api/discovered-devices')
				]);
				const devicesData = await devicesRes.json();
				const discoveredData = await discoveredRes.json();

				// Combine saved devices and discovered devices
				const savedDevices = devicesData.devices || [];
				const discoveredDevices = (discoveredData.devices || []).map(dev => ({...dev, status: 'discovered'}));

				// Filter out discovered devices that are already saved
				const savedDeviceIds = new Set(savedDevices.map(d => d.deviceId));
				const newDiscovered = discoveredDevices.filter(d => !savedDeviceIds.has(d.deviceId));

				devices = [...savedDevices, ...newDiscovered];
				renderDevices();
			} catch (e) {
				console.error('Error fetching devices:', e);
				devices = [];
				renderDevices();
			}
		}

		// Render Devices by Status
		function renderDevices() {
			const onlineDevices = devices.filter(d => d.status === 'online');
			const discoveredDevices = devices.filter(d => d.status === 'discovered');
			const offlineDevices = devices.filter(d => d.status === 'offline');

			// Show/hide sections based on content
			document.getElementById('onlineSection').style.display = onlineDevices.length > 0 ? 'block' : 'none';
			document.getElementById('discoveredSection').style.display = discoveredDevices.length > 0 ? 'block' : 'none';
			document.getElementById('offlineSection').style.display = offlineDevices.length > 0 ? 'block' : 'none';
			document.getElementById('noDevicesMessage').style.display = devices.length === 0 ? 'block' : 'none';

			// Reconcile each section (patch existing tiles in place instead of rebuilding)
			reconcileDeviceSection('onlineDevices', onlineDevices, false);
			reconcileDeviceSection('discoveredDevices', discoveredDevices, true);
			reconcileDeviceSection('offlineDevices', offlineDevices, false);
		}

		// `${containerId}:${id}` -> tile refs, so a device moving between sections gets a fresh tile
		const deviceTiles = new Map();

		function createDeviceTile(isDiscovered) {
			const tile = document.createElement('div');
			const refs = { root: tile, isDiscovered };

			if (isDiscovered) {
				tile.className = 'device-tile discovered-device';
				tile.innerHTML = `
					<div class="device-tile-main">
						<strong style="font-size:15px;"></strong>
						<span class='mono' style="font-size:12px;"></span>
					</div>
					<div class="device-tile-info mono">
						<span></span>
						<span style='color: #ffa500;'>Discovered - Click to Add</span>
					</div>
				`;
				refs.name = tile.querySelector('.device-tile-main strong');
				refs.id = tile.querySelector('.device-tile-main span');
				refs.ip = tile.querySelector('.device-tile-info span');
			} else {
				tile.innerHTML = `
					<div class="device-tile-main">
						<strong style="font-size:15px;"></strong>
						<span class='mono' style="font-size:12px;"></span>
					</div>
					<div class="device-tile-info mono">
						<span></span>
						<span></span>
						<span></span>
						<span></span>
					</div>
					<div class="device-stats">
						<span></span>
						<span></span>
						<span></span>
					</div>
				`;
				refs.name = tile.querySelector('.device-tile-main strong');
				refs.id = tile.querySelector('.device-tile-main span');
				const infoSpans = tile.querySelectorAll('.device-tile-info span');
				refs.group = infoSpans[0];
				refs.ip = infoSpans[1];
				refs.source = infoSpans[2];
				refs.status = infoSpans[3];
				refs.stats = tile.querySelector('.device-stats');
				const statSpans = refs.stats.querySelectorAll('span');
				refs.cpu = statSpans[0];
				refs.temp = statSpans[1];
				refs.mem = statSpans[2];
			}

			return refs;
		}

		function updateDeviceTile(refs, dev) {
			if (refs.isDiscovered) {
				refs.name.textContent = dev.deviceName;
				refs.id.textContent = dev.deviceId;
				refs.ip.textContent = `IP: ${dev.ip}`;
				refs.root.onclick = async () => {
					try {
						const response = await fetch(`/api/device/${dev.deviceId}`, {
							method: 'POST',
							headers: { 'Content-Type': 'application/json' },
							body: JSON.stringify({
								deviceId: dev.deviceId,
								deviceName: dev.deviceName,
								ip: dev.ip
							})
						});

						if (response.ok) {
							toast.success('Device added');
							fetchDevices(); // Refresh the list
						} else {
							toast.error('Failed to add device');
						}
					} catch (e) {
						toast.error('Error adding device');
					}
				};
				return;
			}

			refs.root.className = 'device-tile' + (dev.status === 'online' ? ' active' : '');
			refs.name.textContent = dev.name;
			refs.id.textContent = dev.id;
			refs.group.textContent = `Group: ${dev.group}`;
			refs.ip.textContent = `IP: ${dev.ip}`;
			refs.source.textContent = `Source: ${(!dev.currentSource || String(dev.currentSource).toLowerCase() === 'none') ? 'None' : dev.currentSource}`;
			refs.status.textContent = dev.status;
			refs.status.style.color = dev.status === 'online' ? 'rgb(129, 193, 39)' : '#888';

			const showStats = !!(dev.systemStats && dev.status === 'online');
			refs.stats.style.display = showStats ? '' : 'none';
			if (showStats) {
				const cpuColor = dev.systemStats.cpu > 80 ? '#f87171' : dev.systemStats.cpu > 50 ? '#fbbf24' : '#4ade80';
				const memColor = dev.systemStats.memory.percent > 80 ? '#f87171' : dev.systemStats.memory.percent > 50 ? '#fbbf24' : '#4ade80';
				const tempColor = dev.systemStats.temperature > 78 ? '#f87171' : dev.systemStats.temperature > 65 ? '#fbbf24' : '#4ade80';
				const tempF = ((dev.systemStats.temperature * 9/5) + 32).toFixed(0);
				refs.cpu.textContent = `CPU ${dev.systemStats.cpu}%`;
				refs.cpu.style.color = cpuColor;
				refs.temp.textContent = `TEMP ${tempF}°F`;
				refs.temp.style.color = tempColor;
				refs.mem.textContent = `MEM ${dev.systemStats.memory.percent}%`;
				refs.mem.style.color = memColor;
			}

			refs.root.onclick = () => window.location.href = `/device.html?id=${encodeURIComponent(dev.id)}`;
		}

		function reconcileDeviceSection(containerId, deviceList, isDiscovered) {
			const container = document.getElementById(containerId);
			const seenKeys = new Set();
			let prevRoot = null;

			deviceList.forEach(dev => {
				const id = isDiscovered ? dev.deviceId : dev.id;
				const key = `${containerId}:${id}`;
				seenKeys.add(key);

				let refs = deviceTiles.get(key);
				if (!refs) {
					refs = createDeviceTile(isDiscovered);
					deviceTiles.set(key, refs);
					container.appendChild(refs.root);
				}
				updateDeviceTile(refs, dev);

				const desiredNext = prevRoot ? prevRoot.nextSibling : container.firstChild;
				if (desiredNext !== refs.root) { container.insertBefore(refs.root, desiredNext); }
				prevRoot = refs.root;
			});

			for (const [key, refs] of deviceTiles) {
				if (key.startsWith(`${containerId}:`) && !seenKeys.has(key)) {
					refs.root.remove();
					deviceTiles.delete(key);
				}
			}
		}

		// Add Device Modal
		const showAddDeviceModal = async () => {
			try {
				const res = await fetch('/api/discovered-devices');
				const data = await res.json();
				const discovered = data.devices || [];

				if (discovered.length === 0) {
					toast.warning('No devices discovered. Make sure clients are powered on.');
					return;
				}

				const options = discovered.map(dev => `${dev.deviceName} (${dev.deviceId}) - ${dev.ip}`);
				const choice = await modal.select('Select a device to add:', options, 'Add Device');

				if (choice !== null) {
					const selected = discovered[choice];
					const response = await fetch(`/api/device/${selected.deviceId}`, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({
							deviceId: selected.deviceId,
							deviceName: selected.deviceName,
							ip: selected.ip
						})
					});

					if (response.ok) {
						toast.success('Device added');
						await fetchDevices();
					} else {
						toast.error('Failed to add device');
					}
				}
			} catch (e) {
				toast.error('Error adding device');
			}
		};

		// Initialize WebSocket connection
		const ws = initWebSocket();

		// Handle device updates from WebSocket
		ws.onDevicesUpdate = (updatedDevices) => {
			devices = updatedDevices;
			renderDevices();
		};

		// Handle discovered devices updates from WebSocket
		ws.onDiscoveredDevicesUpdate = (discoveredDevices) => {
			fetchDevices(); // Refresh the devices list (discovered devices aren't in the /ws devices-update snapshot)
		};

		// Handle viewer updates from WebSocket
		ws.onViewersUpdate = (viewers) => {
			activeViewers = viewers;
			// Only update display if updateViewersDisplay function exists
			if (typeof updateViewersDisplay === 'function') {
				updateViewersDisplay();
			}
		};

		/**
		 *  Multi-device relay — one Hub connection covers every device's
		 *  live stats/settings instead of polling or waiting on the ~5s
		 *  Hub-relayed client-status cadence (see 01-scripts/ws-devices.js).
		 */
		const devicesStatsRelay = new NDPiDevicesRelay('stats', (cache) => {
			let changed = false;
			devices.forEach((dev) => {
				const stats = cache[dev.id || dev.deviceId];
				if (stats) { dev.systemStats = stats; changed = true; }
			});
			if (changed) { renderDevices(); }
		});

		const devicesSystemRelay = new NDPiDevicesRelay('system', (cache) => {
			let changed = false;
			devices.forEach((dev) => {
				const currentSource = getRelayedSetting(cache[dev.id || dev.deviceId], 'ndpi_status_ndi_source_target');
				if (currentSource) { dev.currentSource = currentSource.value || 'None'; changed = true; }
			});
			if (changed) { renderDevices(); }
		});

		window.addEventListener('beforeunload', () => {
			devicesStatsRelay.close();
			devicesSystemRelay.close();
		});

		// Initial load
		fetchDevices();

		const pageLogo = document.getElementById('topbarLogo');
		const topbarHeight = document.querySelector('.topbar').clientHeight;
		pageLogo.style.width = topbarHeight ? `${topbarHeight - 10}px` : `100px`;
		pageLogo.style.height = topbarHeight ? `${topbarHeight - 10}px` : `100%`;

	</script>
</body>
</html>
