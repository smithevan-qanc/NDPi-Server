	<link rel="stylesheet" href="/styles.css">

	<script>(function () { if (localStorage.getItem('ndpi_sidebar_collapsed') === 'true') { document.documentElement.classList.add('sidebar-collapsed'); } })();</script>
	<script src="/scripts/auth.js"></script>
	<script src="/scripts/ws-client.js"></script>
	<script src="/scripts/ws-devices.js"></script>
	<script src="/scripts/modal.js"></script>
	<script src="/scripts/screen-saver.js"></script>
	<title>Devices | NDPi Monitor</title>
	<link rel="icon" type="image/svg+xml" href="/api/v2/logo">
	<!-- <link rel="icon" type="image/svg+xml" href="/media/favicon.svg"> -->
</head>

<body class="hide-scrollbar">
	<div id="main-div" class="app">
		<nav class="sidebar">
			<div class="sidebar-logo" onclick="window.location.href='/'">
				<div class="topbar-logo" id="topbarLogo"></div>
				<span class="sidebar-logo-title">NDPi Hub</span>
			</div>
			<div class="sidebar-nav">
				<button id="sidebarToggle" class="nav-btn" title="Collapse sidebar">
					<span class="nav-btn-icon"><svg viewBox="0 0 24 24">

							<line x1="9" y1="4" x2="9" y2="20" />
						</svg></span>
					<span class="nav-btn-label">Collapse</span>

				<button id="navDashboard" class="nav-btn"><span class="nav-btn-icon"><svg viewBox="0 0 24 24">

						</svg></span><span class="nav-btn-label"></span></button>
				<button id="navDevices" class="nav-btn"><span class="nav-btn-icon"><svg viewBox="0 0 24 24">

				<button id="navGroups" class="nav-btn"><span class="nav-btn-icon"><svg viewBox="0 0 24 24">
							<path d="M12 3 2 8l10 5 10-5-10-5Z" />

						</svg></span><span class="nav-btn-label"></span></button>
				<button id="navUsers" class="nav-btn"><span class="nav-btn-icon"><svg viewBox="0 0 24 24">
							<circle cx="9" cy="8" r="3.2" />
							<path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" />
							<path d="M16.5 4.8c1.5.4 2.5 1.7 2.5 3.2s-1 2.8-2.5 3.2" />
							<path d="M18 14.3c2 .5 3.5 2.2 3.5 4.7" />
						</svg></span><span class="nav-btn-label"></span></button>
				<button id="navConsole" class="nav-btn"><span class="nav-btn-icon"><svg viewBox="0 0 24 24">
							<rect x="2" y="4" width="20" height="16" rx="2" />
							<path d="m6 9 3 3-3 3M12 15h6" />
						</svg></span><span class="nav-btn-label"></span></button>
				<button id="navSettings" class="nav-btn"><span class="nav-btn-icon"><svg viewBox="0 0 24 24">
							<circle cx="12" cy="12" r="3" />
							<path
								d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
						</svg></span><span class="nav-btn-label"></span></button>
			</div>
			<div class="sidebar-spacer"></div>
			<div class="sidebar-footer">
				<button id="navAccount" class="nav-btn"></button>
			</div>
		</nav>
		<div class="main">
			<div class="topbar">
				<span class="topbar-title">Devices</span>
				<div class="topbar-spacer"></div>
				<code class="topbar-title" id="sys-time"></code>
			</div>
			<div class="content">

				<section class="dashboard">
					<div class="card" style="grid-column: 1 / -1;">
						<h2>Device Management</h2>
						<div class="card-content" style="display: flex; flex-direction: column; gap: 1rem;">

							<!-- Online Devices -->
							<div class="device-section online" id="onlineSection" style="display: none;">
								<h3>Online Devices</h3>
								<div class="devices-grid" id="onlineDevices"></div>
							</div>

							<!-- Discovered Devices -->
							<div class="device-section discovered" id="discoveredSection" style="display: none;">
								<h3>Discovered Devices (Click to Add)</h3>
								<div class="devices-grid" id="discoveredDevices"></div>
							</div>

							<!-- Offline Devices -->
							<div class="device-section offline" id="offlineSection" style="display: none;">
								<h3>Offline Devices</h3>
								<div class="devices-grid" id="offlineDevices"></div>
							</div>

							<!-- No Devices Message -->
							<div id="noDevicesMessage" style="text-align: center; padding: 2.5rem; color: #888;">
								<p>No devices found</p>
								<p style="font-size: 0.875rem; margin-top: 0.5rem;">Click "Add Device" to discover and
									add new devices</p>
							</div>

						</div>
					</div>
				</section>

				<!-- Floating Action Button -->
				<div class="floating-actions">
					<button class="fab" id="add-button" title="Add Device">
						<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
							class="bi bi-plus-lg" viewBox="0 0 16 16">
							<path fill-rule="evenodd"
								d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2" />
						</svg>
					</button>
				</div>
			</div>
		</div>
	</div>
	<script src="/scripts/functions.js"></script>
	<script>

		(() => {
			applyActiveNav('navDevices');
			const sysTimeEl = document.getElementById('sys-time');
			setInterval(() => {
				sysTimeEl.textContent = new Date().toLocaleTimeString();
			}, 1000);
		})();

		// Global variables
		let devices = []; // adopted devices only -- kept live via ws.onDevicesUpdate + the stats/system relays below, no REST polling needed
		let discoveredDevices = []; // not-yet-added devices -- no snapshot-on-connect WS equivalent, so this still needs a REST fetch
		let groups = [];

		document.getElementById('add-button').addEventListener('click', () => {
			this.onclick = null;
			window.location.href = '/device-discovery.html'
		});

		// Fetch not-yet-added devices. Adopted devices don't need REST polling
		// here at all -- ws.onDevicesUpdate delivers an immediate snapshot on
		// /ws connect (same as dashboard.html) and stays live from there via
		// that socket plus devicesStatsRelay/devicesSystemRelay below.
		// Discovered devices have no such snapshot-on-connect equivalent, so
		// this still needs a real fetch.
		async function fetchDiscoveredDevices() {
			try {
				const res = await fetch('/api/discovered-devices');
				const data = await res.json();
				discoveredDevices = data.devices || [];
				renderDevices();
			} catch (e) {
				console.error('Error fetching discovered devices:', e);
				discoveredDevices = [];
				renderDevices();
			}
		}

		// Render Devices by Status
		function renderDevices() {
			const onlineDevices = devices.filter(d => d.status === 'online');
			const offlineDevices = devices.filter(d => d.status === 'offline');

			// Filter out discovered devices that are already adopted
			const adoptedDeviceIds = new Set(devices.map(d => d.id || d.deviceId));
			const notYetAdded = discoveredDevices
				.filter(d => !adoptedDeviceIds.has(d.deviceId))
				.map(d => ({ ...d, status: 'discovered' }));

			// Show/hide sections based on content
			document.getElementById('onlineSection').style.display = onlineDevices.length > 0 ? 'block' : 'none';
			document.getElementById('discoveredSection').style.display = notYetAdded.length > 0 ? 'block' : 'none';
			document.getElementById('offlineSection').style.display = offlineDevices.length > 0 ? 'block' : 'none';
			document.getElementById('noDevicesMessage').style.display = (devices.length === 0 && notYetAdded.length === 0) ? 'block' : 'none';

			// Reconcile each section (patch existing tiles in place instead of rebuilding)
			reconcileDeviceSection('onlineDevices', onlineDevices, false);
			reconcileDeviceSection('discoveredDevices', notYetAdded, true);
			reconcileDeviceSection('offlineDevices', offlineDevices, false);
		}

		// `${containerId}:${id}` -> tile refs, so a device moving between sections gets a fresh tile
		const deviceTiles = new Map();

		function createDeviceTile(isDiscovered) {
			const tile = document.createElement('div');
			tile.className = 'device-card';
			const refs = { root: tile, isDiscovered };

			if (isDiscovered) {
				tile.dataset.status = 'discovered';
				tile.innerHTML = `
					<div class="device-card-header">
						<div class="device-card-identity">
							<span class="device-card-status-dot"></span>
							<div style="display:flex;flex-direction:column;min-width:0;">
								<span class="device-card-name"></span>
								<span class="device-card-status-text">Discovered</span>
							</div>
						</div>
						<span class="device-card-id mono"></span>
					</div>
					<div class="device-card-meta">
						<div class="device-card-meta-item wide">
							<span class="device-card-meta-label">IP Address</span>
							<span class="device-card-meta-value mono"></span>
						</div>
					</div>
					<div class="device-card-hint">
						<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
						Click to add
					</div>
				`;
				refs.name = tile.querySelector('.device-card-name');
				refs.id = tile.querySelector('.device-card-id');
				refs.ip = tile.querySelector('.device-card-meta-value');
			} else {
				tile.innerHTML = `
					<div class="device-card-header">
						<div class="device-card-identity">
							<span class="device-card-status-dot"></span>
							<div style="display:flex;flex-direction:column;min-width:0;">
								<span class="device-card-name"></span>
								<span class="device-card-status-text"></span>
							</div>
						</div>
						<span class="device-card-id mono"></span>
					</div>
					<div class="device-card-meta">
						<div class="device-card-meta-item">
							<span class="device-card-meta-label">Group</span>
							<span class="device-card-meta-value"></span>
						</div>
						<div class="device-card-meta-item">
							<span class="device-card-meta-label">IP Address</span>
							<span class="device-card-meta-value mono"></span>
						</div>
						<div class="device-card-meta-item wide">
							<span class="device-card-meta-label">Source</span>
							<span class="device-card-meta-value"></span>
						</div>
					</div>
					<div class="device-card-stats">
						<div class="device-card-stat"><span class="device-card-stat-label">CPU</span><span class="device-card-stat-value"></span></div>
						<div class="device-card-stat"><span class="device-card-stat-label">Temp</span><span class="device-card-stat-value"></span></div>
						<div class="device-card-stat"><span class="device-card-stat-label">Mem</span><span class="device-card-stat-value"></span></div>
					</div>
				`;
				const metaValues = tile.querySelectorAll('.device-card-meta-value');
				const statValues = tile.querySelectorAll('.device-card-stat-value');
				refs.name = tile.querySelector('.device-card-name');
				refs.statusText = tile.querySelector('.device-card-status-text');
				refs.id = tile.querySelector('.device-card-id');
				refs.group = metaValues[0];
				refs.ip = metaValues[1];
				refs.source = metaValues[2];
				refs.stats = tile.querySelector('.device-card-stats');
				refs.cpu = statValues[0];
				refs.temp = statValues[1];
				refs.mem = statValues[2];
			}

			return refs;
		}

		function updateDeviceTile(refs, dev) {
			if (refs.isDiscovered) {
				refs.name.textContent = dev.deviceName;
				refs.name.title = dev.deviceName;
				refs.id.textContent = dev.deviceId;
				refs.ip.textContent = dev.ip;
				refs.root.onclick = async () => {
					try {
						const response = await fetch(`/api/device/${dev.deviceId}`, {
							method: 'POST',
							headers: { 'Content-Type': 'application/json' },
							body: JSON.stringify({
								deviceId: dev.deviceId,
								deviceName: dev.deviceName,
								ip: dev.ip
							})
						});

						if (response.ok) {
							toast.success('Device added');
							// No explicit refresh needed -- adopting a device
							// updates clients.json and removes it from the
							// discovered set server-side, both of which push
							// through ws.onDevicesUpdate / ws.onDiscoveredDevicesUpdate
							// automatically.
						} else {
							toast.error('Failed to add device');
						}
					} catch (e) {
						toast.error('Error adding device');
					}
				};
				return;
			}

			refs.root.dataset.status = dev.status === 'online' ? 'online' : 'offline';
			refs.name.textContent = dev.name;
			refs.name.title = dev.name;
			refs.statusText.textContent = dev.status;
			refs.id.textContent = dev.id;
			refs.group.textContent = dev.group || 'Ungrouped';
			refs.ip.textContent = dev.ip;
			const sourceText = (!dev.currentSource || String(dev.currentSource).toLowerCase() === 'none') ? 'None' : dev.currentSource;
			refs.source.textContent = sourceText;
			refs.source.title = sourceText;

			const showStats = !!(dev.systemStats && dev.status === 'online');
			refs.stats.style.display = showStats ? '' : 'none';
			if (showStats) {
				const cpuColor = dev.systemStats.cpu > 80 ? '#f87171' : dev.systemStats.cpu > 50 ? '#fbbf24' : '#4ade80';
				const memColor = dev.systemStats.memory.percent > 80 ? '#f87171' : dev.systemStats.memory.percent > 50 ? '#fbbf24' : '#4ade80';
				const tempColor = dev.systemStats.temperature > 78 ? '#f87171' : dev.systemStats.temperature > 65 ? '#fbbf24' : '#4ade80';
				const tempF = ((dev.systemStats.temperature * 9 / 5) + 32).toFixed(0);
				refs.cpu.textContent = `${dev.systemStats.cpu}%`;
				refs.cpu.style.color = cpuColor;
				refs.temp.textContent = `${tempF}°F`;
				refs.temp.style.color = tempColor;
				refs.mem.textContent = `${dev.systemStats.memory.percent}%`;
				refs.mem.style.color = memColor;
			}

			refs.root.onclick = () => window.location.href = `/device.html?id=${encodeURIComponent(dev.id)}`;
		}

		// Patch a single already-rendered tile in place -- used by the relay
		// callbacks below so a message about one device doesn't touch every
		// other card's DOM. Only ever called for real (non-discovered)
		// devices the relay actually knows about, so the tile always lives
		// in the online/offline section matching the device's current status.
		function patchDeviceTile(deviceId) {
			const dev = devices.find(d => (d.id || d.deviceId) === deviceId);
			if (!dev) return;
			const containerId = dev.status === 'online' ? 'onlineDevices' : 'offlineDevices';
			const refs = deviceTiles.get(`${containerId}:${deviceId}`);
			if (refs) { updateDeviceTile(refs, dev); }
		}

		function reconcileDeviceSection(containerId, deviceList, isDiscovered) {
			const container = document.getElementById(containerId);
			const seenKeys = new Set();
			let prevRoot = null;

			deviceList.forEach(dev => {
				const id = isDiscovered ? dev.deviceId : dev.id;
				const key = `${containerId}:${id}`;
				seenKeys.add(key);

				let refs = deviceTiles.get(key);
				if (!refs) {
					refs = createDeviceTile(isDiscovered);
					deviceTiles.set(key, refs);
					container.appendChild(refs.root);
				}
				updateDeviceTile(refs, dev);

				const desiredNext = prevRoot ? prevRoot.nextSibling : container.firstChild;
				if (desiredNext !== refs.root) { container.insertBefore(refs.root, desiredNext); }
				prevRoot = refs.root;
			});

			for (const [key, refs] of deviceTiles) {
				if (key.startsWith(`${containerId}:`) && !seenKeys.has(key)) {
					refs.root.remove();
					deviceTiles.delete(key);
				}
			}
		}

		// Add Device Modal
		const showAddDeviceModal = async () => {
			try {
				const res = await fetch('/api/discovered-devices');
				const data = await res.json();
				const discovered = data.devices || [];

				if (discovered.length === 0) {
					toast.warning('No devices discovered. Make sure clients are powered on.');
					return;
				}

				const options = discovered.map(dev => `${dev.deviceName} (${dev.deviceId}) - ${dev.ip}`);
				const choice = await modal.select('Select a device to add:', options, 'Add Device');

				if (choice !== null) {
					const selected = discovered[choice];
					const response = await fetch(`/api/device/${selected.deviceId}`, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({
							deviceId: selected.deviceId,
							deviceName: selected.deviceName,
							ip: selected.ip
						})
					});

					if (response.ok) {
						toast.success('Device added');
						// No explicit refresh needed -- see the discovered-tile
						// click handler above for why.
					} else {
						toast.error('Failed to add device');
					}
				}
			} catch (e) {
				toast.error('Error adding device');
			}
		};

		// Initialize WebSocket connection
		const ws = initWebSocket();

		// Handle device updates from WebSocket
		ws.onDevicesUpdate = (updatedDevices) => {
			// Preserve the freshest per-device stats (kept live by devicesStatsRelay,
			// ~1s cadence) instead of letting this ~5s Hub snapshot overwrite them
			// with a staler copy -- otherwise stats visibly flash between two
			// different values on every relay tick.
			const statsById = new Map(devices.map(d => [d.id, d.systemStats]));
			devices = updatedDevices.map(d => ({ ...d, systemStats: statsById.get(d.id) || d.systemStats }));
			renderDevices();
		};

		// Handle discovered devices updates from WebSocket -- the broadcast
		// already carries the full list, so no REST round-trip is needed here.
		ws.onDiscoveredDevicesUpdate = (updatedDiscovered) => {
			discoveredDevices = updatedDiscovered || [];
			renderDevices();
		};

		/**
		 *  Multi-device relay — one Hub connection covers every device's
		 *  live stats/settings instead of polling or waiting on the ~5s
		 *  Hub-relayed client-status cadence (see 01-scripts/ws-devices.js).
		 */
		const devicesStatsRelay = new NDPiDevicesRelay('stats', (cache, changedIds) => {
			// changedIds === null only on the initial snapshot/reconnect,
			// where every device is "new" and needs a full render; otherwise
			// it's exactly the devices that changed this tick, so only their
			// tiles get touched.
			const idsToApply = changedIds === null ? Object.keys(cache) : changedIds;
			let changed = false;
			idsToApply.forEach((id) => {
				const dev = devices.find(d => (d.id || d.deviceId) === id);
				const stats = cache[id];
				if (dev && stats) { dev.systemStats = stats; changed = true; }
			});
			if (!changed) return;
			if (changedIds === null) { renderDevices(); }
			else { changedIds.forEach(patchDeviceTile); }
		});

		const devicesSystemRelay = new NDPiDevicesRelay('system', (cache, changedIds) => {
			const idsToApply = changedIds === null ? Object.keys(cache) : changedIds;
			let changed = false;
			idsToApply.forEach((id) => {
				const dev = devices.find(d => (d.id || d.deviceId) === id);
				const currentSource = getRelayedSetting(cache[id], 'ndpi_status_ndi_source_target');
				if (dev && currentSource) { dev.currentSource = currentSource.value || 'None'; changed = true; }
			});
			if (!changed) return;
			if (changedIds === null) { renderDevices(); }
			else { changedIds.forEach(patchDeviceTile); }
		});

		window.addEventListener('beforeunload', () => {
			devicesStatsRelay.close();
			devicesSystemRelay.close();
		});

		// Initial load. Adopted devices don't need a REST fetch here -- the
		// devices-update snapshot ws.onDevicesUpdate receives immediately on
		// /ws connect covers that.
		fetchDiscoveredDevices();

	</script>
</body>

</html>
