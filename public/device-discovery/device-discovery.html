<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="/styles.css">

	<script>(function(){if(localStorage.getItem('ndpi_sidebar_collapsed')==='true'){document.documentElement.classList.add('sidebar-collapsed');}})();</script>
	<script src="/scripts/auth.js"></script>
	<script src="/scripts/ws-client.js"></script>
	<script src="/scripts/modal.js"></script>
	<script src="/scripts/screen-saver.js"></script>
	<title>Device Discovery | NDPi Monitor</title>
	<link rel="icon" type="image/svg+xml" href="/api/v2/logo">
	<!-- <link rel="icon" type="image/svg+xml" href="/media/favicon.svg"> -->
</head>
<body class="hide-scrollbar">
	<div id="main-div" class="app">
		<nav class="sidebar">
			<div class="sidebar-logo" onclick="window.location.href='/'">
				<div class="topbar-logo" id="topbarLogo"></div>
				<span class="sidebar-logo-title">NDPi Hub</span>
			</div>
			<div class="sidebar-nav">
				<button id="sidebarToggle" class="nav-btn" title="Collapse sidebar">
					<span class="nav-btn-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg></span>
					<span class="nav-btn-label">Collapse</span>
				</button>
				<button id="navDashboard" class="nav-btn"><span class="nav-btn-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span class="nav-btn-label"></span></button>
				<button id="navDevices" class="nav-btn"><span class="nav-btn-icon"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span><span class="nav-btn-label"></span></button>
				<button id="navGroups" class="nav-btn"><span class="nav-btn-icon"><svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M2 12l10 5 10-5M2 16l10 5 10-5"/></svg></span><span class="nav-btn-label"></span></button>
				<button id="navUsers" class="nav-btn"><span class="nav-btn-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16.5 4.8c1.5.4 2.5 1.7 2.5 3.2s-1 2.8-2.5 3.2"/><path d="M18 14.3c2 .5 3.5 2.2 3.5 4.7"/></svg></span><span class="nav-btn-label"></span></button>
				<button id="navConsole" class="nav-btn"><span class="nav-btn-icon"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m6 9 3 3-3 3M12 15h6"/></svg></span><span class="nav-btn-label"></span></button>
				<button id="navSettings" class="nav-btn"><span class="nav-btn-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span><span class="nav-btn-label"></span></button>
			</div>
			<div class="sidebar-spacer"></div>
			<div class="sidebar-footer">
				<button id="navAccount" class="nav-btn"></button>
			</div>
		</nav>
		<div class="main">
			<div class="topbar">
				<div class="back-btn" onclick="history.back()">
					<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-arrow-left-circle" viewBox="0 0 16 16">
  					<path fill-rule="evenodd" d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-4.5-.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5z"/>
					</svg>
				</div>
				<span class="topbar-title">Device Discovery</span>
				<div class="topbar-spacer"></div>
			</div>
			<div class="content">

		<section class="dashboard">
			<div class="card" style="grid-column: 1 / -1;">
				<h2>Discover Devices</h2>
				<div class="card-content">
					
					<div class="discovery-card" id="discoveryCard">
						<div class="discovery-status" id="discoveryStatus">
							Click "Scan for Devices" to discover NDI clients on your network
						</div>
						
						<button class="discovery-button" id="scanBtn" onclick="startDiscovery()">
							Scan for Devices
						</button>
						
						<button class="discovery-button" id="refreshBtn" onclick="refreshDiscovery()" style="display: none;">
							Refresh Scan
						</button>
					</div>
					
					<div id="discoveredDevices" class="devices-grid" style="margin-top: 1.25rem;"></div>
					
				</div>
			</div>
		</section>
			</div>
		</div>
	</div>
	<script src="/scripts/functions.js"></script>
	<script>

		(() => {
			applyActiveNav('navDevices');
			startDiscovery();
		})();

		let isScanning = false;
		let discoveredDevices = [];

		async function startDiscovery() {
			if (isScanning) return;
			
			isScanning = true;
			document.getElementById('scanBtn').disabled = true;
			document.getElementById('scanBtn').textContent = 'Scanning...';
			document.getElementById('discoveryStatus').textContent = 'Scanning network for NDI devices...';
			
			try {
				// Clear previous results
				document.getElementById('discoveredDevices').innerHTML = '';
				
				// Wait a moment for the UI to update
				await new Promise(resolve => setTimeout(resolve, 500));
				
				// Fetch discovered devices
				const response = await fetch('/api/discovered-devices');
				const data = await response.json();
				discoveredDevices = data.devices || [];
				
				// Update UI
				isScanning = false;
				document.getElementById('scanBtn').disabled = false;
				document.getElementById('scanBtn').style.display = 'none';
				document.getElementById('refreshBtn').style.display = 'inline-block';
				
				if (discoveredDevices.length === 0) {
					document.getElementById('discoveryStatus').textContent = 
						'No devices found. Make sure NDI client devices are powered on and connected to the network.';
				} else {
					document.getElementById('discoveryStatus').textContent = 
						`Found ${discoveredDevices.length} device${discoveredDevices.length === 1 ? '' : 's'}. Click on a device to add it.`;
					renderDiscoveredDevices();
				}
				
			} catch (error) {
				console.error('Discovery error:', error);
				isScanning = false;
				document.getElementById('scanBtn').disabled = false;
				document.getElementById('scanBtn').textContent = 'Scan for Devices';
				document.getElementById('discoveryStatus').textContent = 'Error during discovery. Please try again.';
			}
		}

		async function refreshDiscovery() {
			document.getElementById('refreshBtn').textContent = 'Refreshing...';
			document.getElementById('refreshBtn').disabled = true;
			
			try {
				const response = await fetch('/api/discovered-devices');
				const data = await response.json();
				discoveredDevices = data.devices || [];
				
				if (discoveredDevices.length === 0) {
					document.getElementById('discoveryStatus').textContent = 
						'No devices found. Make sure NDI client devices are powered on and connected to the network.';
					document.getElementById('discoveredDevices').innerHTML = '';
				} else {
					document.getElementById('discoveryStatus').textContent = 
						`Found ${discoveredDevices.length} device${discoveredDevices.length === 1 ? '' : 's'}. Click on a device to add it.`;
					renderDiscoveredDevices();
				}
				
			} catch (error) {
				console.error('Refresh error:', error);
				document.getElementById('discoveryStatus').textContent = 'Error refreshing devices. Please try again.';
			}
			
			document.getElementById('refreshBtn').textContent = 'Refresh Scan';
			document.getElementById('refreshBtn').disabled = false;
		}

		function renderDiscoveredDevices() {
			const container = document.getElementById('discoveredDevices');
			container.innerHTML = '';
			
			discoveredDevices.forEach(device => {
				const deviceElement = document.createElement('div');
				deviceElement.className = 'device-card';
				deviceElement.dataset.status = 'discovered';
				deviceElement.innerHTML = `
					<div class="device-card-header">
						<div class="device-card-identity">
							<span class="device-card-status-dot"></span>
							<div style="display:flex;flex-direction:column;min-width:0;">
								<span class="device-card-name">${device.deviceName}</span>
								<span class="device-card-status-text">Discovered</span>
							</div>
						</div>
						<span class="device-card-id mono">${device.deviceId}</span>
					</div>
					<div class="device-card-meta">
						<div class="device-card-meta-item wide">
							<span class="device-card-meta-label">IP Address</span>
							<span class="device-card-meta-value mono">${device.ip}</span>
						</div>
					</div>
					<div class="device-card-actions">
						<button class="add-device-btn" onclick="addDevice('${device.deviceId}', '${device.deviceName}', '${device.ip}')">
							Add Device
						</button>
					</div>
				`;
				container.appendChild(deviceElement);
			});
		}

		async function addDevice(deviceId, deviceName, ip) {
			try {
				const response = await fetch(`/api/device/${deviceId}`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						deviceId: deviceId,
						deviceName: deviceName,
						ip: ip
					})
				});
				
				if (response.ok) {
					toast.success('Device added');
					// Navigate back to devices page
					setTimeout(() => window.location.href = '/devices.html', 500);
				} else {
					toast.error('Failed to add device');
				}
			} catch (e) {
				toast.error('Error adding device');
			}
		}

		// Initialize WebSocket for real-time updates
		const ws = initWebSocket();

		ws.onDiscoveredDevicesUpdate = (devices) => {
			if (isScanning) return; // Don't update during scan
			discoveredDevices = devices;
			if (discoveredDevices.length > 0) {
				document.getElementById('discoveryStatus').textContent = 
					`Found ${discoveredDevices.length} device${discoveredDevices.length === 1 ? '' : 's'}. Click on a device to add it.`;
				renderDiscoveredDevices();
			}
		};
	</script>
</body>
</html>
