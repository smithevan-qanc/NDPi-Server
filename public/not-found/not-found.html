<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="/styles.css">
		<script>(function(){var c=localStorage.getItem('ndpi_theme_color');if(c){document.documentElement.style.setProperty('--accent',c);}})();</script>
		<title>Not Found | NDPi Monitor</title>
		<link rel="icon" type="image/svg+xml" href="/media/favicon.svg">
	</head>
	<body class="hide-scrollbar">
		<div class="auth-container">
			<div class="auth-card">
				<img src="/api/logo" alt="NLC Logo" style="width: 7.5rem; height: 7.5rem; display: block; margin: 0 auto 0.625rem auto;">
				<h1 class="auth-title">Not Found</h1>
				<p class="auth-subtitle">This page has moved or does not exist.</p>
			</div>
		</div>
		<script>
			// Initialize UI scale from saved setting -- via root font-size,
			// not body zoom/transform (see 01-scripts/functions.js's
			// setScale() for why).
			const savedScale = localStorage.getItem('ndpi_ui_scale') || '100';
			document.documentElement.style.fontSize = `${savedScale}%`;
		</script>
	</body>
</html>
