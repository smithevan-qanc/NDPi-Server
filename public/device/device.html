				<!-- Jumps to the matching card below via scrollIntoView() -- see initSectionNav() -->

	<script src="/scripts/functions.js"></script>
	<script src="/scripts/ws-hub-stats.js"></script>
	<script src="/scripts/on-screen-keyboard.js"></script>
	<script>

		(() => {
			applyActiveNav('navDevices');
			initGlobalHubStats();
			initSectionNav();
		})();

		// Nav pills at the top of the content area jump straight to their
		// matching card via scrollIntoView() -- .content already has
		// scroll-behavior:smooth, so this animates for free. Delegated on
		// the container since its buttons exist from first paint (unlike
		// the cards themselves, which are only built once loadDevice()
		// resolves).
		function initSectionNav() {
			const nav = document.getElementById('pageSectionNav');
			if (!nav) return;
			nav.addEventListener('click', (e) => {
				const btn = e.target.closest('.page-section-nav-btn');
				if (!btn) return;
				const target = document.getElementById(btn.dataset.target);
				if (target) { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
			});
		}

		// Highlights whichever card is currently in view -- run once the
		// cards actually exist in the DOM (renderDevice() builds them from
		// a template string, so this can't be set up until after that call).
		function initSectionNavObserver() {
			const nav = document.getElementById('pageSectionNav');
			const contentEl = document.querySelector('.content');
			if (!nav || !contentEl) return;
			const buttons = Array.from(nav.querySelectorAll('.page-section-nav-btn'));
			const sections = buttons.map((btn) => document.getElementById(btn.dataset.target)).filter(Boolean);
			if (sections.length === 0) return;
			const observer = new IntersectionObserver((entries) => {
				entries.forEach((entry) => {
					const btn = buttons.find((b) => b.dataset.target === entry.target.id);
					if (btn) { btn.classList.toggle('active', entry.isIntersecting); }
				});
			}, { root: contentEl, rootMargin: '-40% 0px -55% 0px', threshold: 0 });
			sections.forEach((sec) => observer.observe(sec));
		}

		let device = null;
		let sources = [];
		let groups = [];
		let lastRenderedSettingsJSON = null; // last device.settings content the settings grid was built from

		async function loadDevice() {
			const params = new URLSearchParams(window.location.search);
			const deviceId = params.get('id');

			if (!deviceId) {
				window.location.href = '/';
				return;
			}

			try {
				const [devRes, grpRes] = await Promise.all([
					fetch('/api/devices'),
					fetch('/api/groups')
				]);

				const devData = await devRes.json();
				const grpData = await grpRes.json();
				groups = grpData.groups || [];

				device = devData.devices.find(d => d.id === deviceId || d.deviceId === deviceId);

				if (!device) {
					document.getElementById('deviceContent').innerHTML = '<p style="color: #dc5050;">Device not found</p>';
					return;
				}
				renderDevice();
			} catch (e) {
				console.error('Error loading device:', e);
				document.getElementById('deviceContent').innerHTML = '<p style="color: #dc5050;">Error loading device</p>';
			}
		}

		function formatUptime(seconds) {
			// Called with values relayed verbatim from whatever the Client
			// device reports (device.ndiInfo.uptime in particular) -- don't
			// assume it arrives as a well-formed number.
			seconds = Number(seconds);
			if (!Number.isFinite(seconds) || seconds < 0) return '0s';
			seconds = Math.round(seconds);
			const hours = Math.floor(seconds / 3600);
			const minutes = Math.floor((seconds % 3600) / 60);
			const secs = seconds % 60;
			const padNum = (num) => { return String(num).padStart(2, '0'); };

			if (hours > 0) {
				return `${padNum(hours)}:${padNum(minutes)}:${padNum(secs)}`;
			} else if (minutes > 0) {
				return `${padNum(minutes)}:${padNum(secs)}`;
			}
			return `00:${padNum(secs)}`;
		}

		function parseNdiUrl(url) {
			// Parse NDI URL like "192.168.1.100:5961" or "ndi://hostname/source"
			if (!url) return { ip: 'Unknown', port: 'Unknown' };
			const match = url.match(/^(?:ndi:\/\/)?([^:\/]+)(?::(\d+))?/);
			if (match) {
				return { ip: match[1], port: match[2] || '5961' };
			}
			return { ip: url, port: '5961' };
		}

		function parseSourceName(name) {
			// Parse source name like "HOSTNAME (SourceName)" 
			const match = name.match(/^(.+?)\s*\((.+)\)$/);
			if (match) {
				return { hostname: match[1], sourceName: match[2] };
			}
			return { hostname: name, sourceName: 'Default' };
		}

		function renderDevice() {
			document.getElementById('deviceName').textContent = device.name;

			let admDeviceActionsHtml = '';

			if (account.isAdmin) {
				admDeviceActionsHtml = `
				<div class="card" id="card-actions">
					<h2 class="section-title">Device Actions</h2>
					<div class="card-content">
						<div class="device-actions">
							<button onclick="rebootDevice()" class="button-danger">Reboot</button>
							<button onclick="shutdownDevice()" class="button-danger">Shutdown</button>
							<button onclick="forgetDevice()" class="button-danger">Forget Device</button>
						</div>
					</div>
				</div>
				`;
				document.getElementById('changeName').innerHTML = `
				<button
					onclick="renameDevice()"
					style="
						background:none;
						border:none;
						cursor:pointer;
						padding:4px;
						opacity:0.5;
						transition:opacity 0.2s;
					"
					onmouseover="this.style.opacity='1'"
					onmouseout="this.style.opacity='0.5'" 
					title="Rename Device"
				>
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
						<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
					</svg>
				</button>`;
			}

			// Build static page shell — dynamic content filled by renderSources() and updateDevice()
			document.getElementById('deviceContent').innerHTML = `
				<div class="device-page-container">
					<!-- NDI Source Selection -->
					<div class="card" id="card-sources">
						<h2 class="section-title">Select NDI Source</h2>
						<div class="card-content">
							<div id="deviceSourceGrid" class="source-grid"></div>
						</div>
					</div>

					<!-- Display Controls -->
					<div class="card" id="card-display">
						<h2 class="section-title">Display Controls</h2>
						<div class="card-content">
							<div class="display-controls">
								<label for="noSourceDisplaySelect" class="settings-label">No Source Display</label>
								<select id="noSourceDisplaySelect" class="mono" onchange="saveSetting('ndpi_status_no_source_display_mode', this.value)"></select>

								<div style="width:-webkit-fill-available;"></div>

								<button onclick="cecPowerOn()" style="flex:1;" class="roku-button-power">
									TV Power |
									<span style="font-weight: 800;">ON</span>
								</button>
								<button onclick="cecPowerOff()" style="flex:1;" class="roku-button-power">
									TV Power |
									<span style="font-weight: 800;">OFF</span>
								</button>
								<button onclick="cecVolumeDown()" style="flex:1;" class="roku-button-power">
									Volume |
									<span style="font-weight: 800;">&#8722;</span>
								</button>
								<button onclick="cecVolumeUp()" style="flex:1;" class="roku-button-power">
									Volume |
									<span style="font-weight: 800;">+</span>
								</button>
								<button onclick="cecActiveSource()" style="flex:1;" class="roku-button-power">
									TV Input |
									<span style="font-weight: 800;">Switch to This Device</span>
								</button>
							</div>
						</div>
					</div>

					<!-- Overlay Image -->
					<div class="card" id="card-overlay">
						<h2 class="section-title">Overlay Image</h2>
						<div class="card-content">
							<div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;">
								<div style="display:flex;flex-direction:column;gap:8px;flex:1;min-width:220px;">
									<input type="file" id="overlayUpload" accept="image/*" style="text-align-last:start;">
									<div style="display:flex;gap:8px;">
										<button onclick="saveOverlay()" id="saveOverlayBtn" class="button-primary" disabled>Set Overlay</button>
										<button onclick="resetOverlay()" class="button-subtle">Reset Overlay</button>
									</div>
								</div>
								<img id="overlayPreview" style="max-width:160px;max-height:90px;border-radius:8px;background:rgba(255,255,255,0.05);object-fit:contain;">
							</div>
						</div>
					</div>

					<!-- Device Status Information -->
					<div class="card" id="card-info">
						<h2 class="section-title">Device Information</h2>
						<div class="card-content">
							<div id="infoGrid" class="info-grid"></div>
						</div>
					</div>

					<!-- Full System Stats -->
					<div class="card" id="card-stats">
						<h2 class="section-title">System Stats</h2>
						<div class="card-content">
							<div id="fullStatsGrid" class="info-grid"></div>
						</div>
					</div>

					<!-- Device Settings -->
					<div class="card" id="card-settings">
						<h2 class="section-title">Device Settings</h2>
						<div class="card-content">
							<div id="deviceSettingsGrid" class="info-grid"></div>
						</div>
					</div>

					<!-- Software Update -->
					<div class="card" id="card-update">
						<h2 class="section-title">Software Update</h2>
						<div class="card-content">
							<div style="display:flex;gap:10px;flex-wrap:wrap;">
								<button onclick="checkForDeviceUpdate()" class="button-subtle">Check for Update</button>
								<button onclick="installDeviceUpdate()" id="installUpdateBtn" class="button-primary" hidden>Install Update</button>
							</div>
							<div id="deviceVersionInfo" class="settings-hint"></div>
						</div>
					</div>
					${admDeviceActionsHtml}
				</div>
			`;

			// Fill dynamic sections
			renderSources();
			updateDevice();
			document.getElementById('overlayUpload').addEventListener('change', handleOverlayFile);
			const navBtnActions = document.getElementById('navBtnActions');
			if (navBtnActions) { navBtnActions.hidden = !account.isAdmin; }
			initSectionNavObserver();

			// Open direct-to-device sockets for true real-time updates
			// (see connectDeviceSockets() below) once we know its IP.
			connectDeviceSockets();
		}

		// The Client stores 'no source selected' as a literal lowercase
		// 'none' string once a source has ever actively been cleared
		// (Client__v3_1_0/service/functions.js's 'set-source'/'ndi' handler
		// does `String(data || 'none')`), not just as an empty/falsy value —
		// so checking against the capitalized 'None' placeholder alone
		// missed that case entirely (the "None" card would show unselected
		// even though the device really had no source assigned).
		function isNoSource(value) {
			const normalized = String(value ?? '').trim().toLowerCase();
			return normalized === '' || normalized === 'none';
		}

		function renderSources() {
			const sourceGrid = document.getElementById('deviceSourceGrid');
			if (!sourceGrid || !device) return;

			const noSourceSelected = isNoSource(device.currentSource);

			const noneCard = `
				<div>
					<div class="source-card ${noSourceSelected ? 'selected' : ''}" data-source="" onclick="selectSource('')">
						<div class="source-name">None</div>
						<div class="source-host">No source assigned</div>
						<div class="source-info">
							<div>░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░</div>
							<div>░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░</div>
						</div>
						${noSourceSelected ? '<div class="source-selected-badge" style="background:#666;">Current</div>' : ''}
					</div>
				</div>
			`;

			const escAttr = (s) => String(s ?? '').replace(/'/g, "\\'");

			const sourceCards = sources.length > 0 ? sources.map(src => {
				const parsed = parseSourceName(src.name);
				const urlInfo = parseNdiUrl(src.url);
				const isSelected = String(device.currentSource || '').toUpperCase() == String(src.name || '').toUpperCase();
				return `
					<div>
						<div class="source-card ${isSelected ? 'selected' : ''}" onclick="selectSource('${escAttr(src.name)}')" oncontextmenu="buildContext_Source(event, {name:'${escAttr(src.name)}', url:'${escAttr(src.url)}', favorite:${!!src.favorite}})">
							${src.favorite ? `
							<button type="button" class="source-fav-btn favorited" onclick="event.stopPropagation(); toggleFavoriteSource(this, '${escAttr(src.name)}', '${escAttr(src.url)}')" title="Remove from favorites">
								<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.8L12 3.5z"/></svg>
							</button>
							` : ''}
							<div class="source-name">${parsed.sourceName}</div>
							<div class="source-host">${parsed.hostname}</div>
							<div class="source-info">
								<span>IP: ${urlInfo.ip}</span>
								<span>Port: ${urlInfo.port}</span>
							</div>
							${isSelected ? '<div class="source-selected-badge">Current</div>' : ''}
						</div>
					</div>
				`;
			}).join('') : '<p style="color:#888;grid-column:1/-1;"></p>';

			sourceGrid.innerHTML = noneCard + sourceCards;
		}

		// Star-button toggle on a source card -- adds/removes it from the
		// Hub-wide favorited-sources list (POST /api/favorite-ndi-sources/
		// toggle). Updates this card's button immediately from the
		// server's authoritative response rather than guessing locally,
		// and patches the matching entry in `sources` so a later
		// renderSources() (e.g. from the next /ws/sources push) stays
		// consistent.
		async function toggleFavoriteSource(btnEl, name, url) {
			btnEl.disabled = true;
			try {
				const res = await fetch('/api/v2/favorite-ndi-sources/toggle', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ name, url }),
				});
				if (res.ok) {
					const data = await res.json();
					const src = sources.find(s => s.name === name);
					if (src) { src.favorite = data.favorite; }
					btnEl.classList.toggle('favorited', data.favorite);
					btnEl.title = data.favorite ? 'Remove from favorites' : 'Add to favorites';
					toast.success(data.favorite ? 'Added to favorites' : 'Removed from favorites');
				} else {
					toast.error('Failed to update favorite');
				}
			} catch (e) {
				toast.error('Error updating favorite');
			} finally {
				btnEl.disabled = false;
			}
		}

		// Favorite/Unfavorite item on the source card's right-click context
		// menu (see buildContext_Source() in 01-scripts/modal.js). No button
		// element to patch in place here (unlike toggleFavoriteSource above,
		// which owns the star button that triggered it) -- the star's own
		// visibility depends on favorite state, so a full renderSources() is
		// the simplest correct way to pick up the change everywhere it's
		// reflected (star button, menu's own label next time it opens).
		async function toggleFavoriteSourceFromMenu(name, url) {
			try {
				const res = await fetch('/api/v2/favorite-ndi-sources/toggle', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ name, url }),
				});
				if (res.ok) {
					const data = await res.json();
					const src = sources.find(s => s.name === name);
					if (src) { src.favorite = data.favorite; }
					toast.success(data.favorite ? 'Added to favorites' : 'Removed from favorites');
					renderSources();
				} else {
					toast.error('Failed to update favorite');
				}
			} catch (e) {
				toast.error('Error updating favorite');
			}
		}

		/**
		 *  Clock-sync pill — shown next to Uptime. Every /ws/stats message
		 *  includes the device's own `systemTime` (client_api_server.js's
		 *  getSystemStats(): `systemTime: String(new Date())`); compare it
		 *  to this browser's clock and flag anything more than 3s apart.
		 *  Only meaningful once the direct /ws/stats socket has delivered at
		 *  least one message (the Hub-relayed client-status path doesn't
		 *  carry systemTime at all) — shows a neutral placeholder until then.
		 */
		// One icon per sync state instead of a text label -- shape carries
		// the meaning (not just color), so it stays legible without relying
		// on colorblind-unsafe green/yellow/red alone.
		const SYNC_ICON_UNKNOWN = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="8" y1="12" x2="16" y2="12"/></svg>';
		const SYNC_ICON_OK = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.3l2.4 2.4L15.8 9"/></svg>';
		const SYNC_ICON_MILD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>';
		const SYNC_ICON_SEVERE = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 21.5 20H2.5L12 3.2Z"/><line x1="12" y1="9.5" x2="12" y2="14"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg>';

		function syncPillHtml() {
			const sync = device && device.clockSync;

			let icon = SYNC_ICON_UNKNOWN;
			let color = '#888';
			let tooltip = 'Clock sync status unknown -- waiting for the device\'s own reported time.';

			if (sync) {
				const absDiff = Math.abs(sync.diffSeconds);
				if (sync.inSync) {
					icon = SYNC_ICON_OK;
					color = '#4ade80';
					tooltip = 'Browser and device clocks are in sync.';
				} else if (absDiff <= 10) {
					icon = SYNC_ICON_MILD;
					color = '#fbbf24';
					tooltip = `Device clock is ${absDiff.toFixed(1)}s ${sync.diffSeconds > 0 ? 'ahead' : 'behind'} the browser's.`;
				} else {
					icon = SYNC_ICON_SEVERE;
					color = '#f87171';
					tooltip = `Device clock is ${absDiff.toFixed(1)}s ${sync.diffSeconds > 0 ? 'ahead' : 'behind'} the browser's.`;
				}
			}

			return `
				<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;" title="${tooltip}">
					<span style="color:#888;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">Sync</span>
					<span style="color:${color};width:20px;height:20px;display:flex;">${icon}</span>
				</div>
			`;
		}

			const memColor = device.systemStats.memory.percent > 80 ? '#f87171' : device.systemStats.memory.percent > 50 ? '#fbbf24' : '#4ade80';
			const tempColor = device.systemStats.temperature > 78 ? '#f87171' : device.systemStats.temperature > 65 ? '#fbbf24' : '#4ade80';

			statsHeader.innerHTML = `

					<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;">
						<span style="color:#888;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">CPU</span>

						<span style="color:#888;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">MEM</span>
						<code><span style="color:${memColor};font-weight:600;font-size:16px;">${device.systemStats.memory.percent}%</span></code>
					</div>
					<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;">
						<span style="color:#888;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">Uptime</span>

				// assume framerate arrives as a number.
				const framerate = device.ndiInfo ? Number(device.ndiInfo.framerate) : NaN;

								<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

									<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>

		function getSetting(key) {
			if (!device || !Array.isArray(device.settings)) return null;
			const entry = device.settings.find(([k]) => k === key);
			return entry ? entry[1] : null;
		}

		// 'No Source Display' -- replaces the old dedicated Display
		// Overlay/Blank Display buttons. Both used to just write
		// 'ndpi_status_no_source_display_mode' to 'overlay'/'blank' anyway
		// (see hub_api_server.js's deviceCommandRoute('overlay'/'blank', ...)),
		// so this is the same write through the generic saveSetting()
		// mechanism, with its options sourced from whatever the device
		// itself reports for that setting rather than hardcoded.
		function renderNoSourceDisplayControl() {
			const select = document.getElementById('noSourceDisplaySelect');
			if (!select) return;

			const setting = getSetting('ndpi_status_no_source_display_mode');
			if (!setting || !Array.isArray(setting.options) || setting.options.length === 0) {
				select.innerHTML = '';
				select.disabled = true;
				return;
			}

			select.disabled = !setting.allowEditExternal;
			select.innerHTML = setting.options.map(([label, value]) =>
				`<option value="${value}" ${value === setting.value ? 'selected' : ''}>${label}</option>`
			).join('');
		}

		/**
		 *  Device Settings — full parity with the remote-settings editor in
		 *  Client__v3_1_0/public/system.js: every setting the device reports
		 *  (Array.from(fileMap), relayed here via the Hub's /ws GUI socket),
		 *  grouped the same way Client's own local UI groups them, editable
		 *  fields sending 'set-setting' commands through the Hub relay and
		 *  read-only fields shown disabled (not hidden) for full visibility —
		 *  matching Client's own treatment rather than filtering them out.
		 */
		function renderSettings() {
			const grid = document.getElementById('deviceSettingsGrid');
			if (!grid) return;

			// updateDevice() calls this on every device change, not just settings
			// changes (e.g. the ~5s Hub-relay status tick) -- skip rebuilding the
			// grid when the reported settings haven't actually changed, so an
			// in-progress edit in one of these inputs doesn't get wiped out by an
			// unrelated update elsewhere on the page.
			const settingsJSON = JSON.stringify(device.settings || null);
			if (settingsJSON === lastRenderedSettingsJSON) return;
			lastRenderedSettingsJSON = settingsJSON;

			if (!Array.isArray(device.settings) || device.settings.length === 0) {
				grid.innerHTML = '<p style="color:#888;grid-column:1/-1;">No settings reported by this device yet.</p>';
				return;
			}

			// Fields already covered by dedicated controls elsewhere on this page.
			const excluded = ['device_name', 'media_overlay_image', 'ndpi_status_no_source_display_mode'];

			const fieldGroups = new Map(); // group label -> [[key, obj], ...]
			device.settings.forEach(([key, obj]) => {
				if (excluded.includes(key)) return;
				const groupKey = obj.group || 'Other';
				if (!fieldGroups.has(groupKey)) { fieldGroups.set(groupKey, []); }
				fieldGroups.get(groupKey).push([key, obj]);
			});

			if (fieldGroups.size === 0) {
				grid.innerHTML = '<p style="color:#888;grid-column:1/-1;">No settings available.</p>';
				return;
			}

			const groupLabel = (name) => name.split('_').join(' ').replace(/\w\S*/g, (w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());

			grid.innerHTML = Array.from(fieldGroups.entries()).map(([groupKey, fields]) => {
				const fieldsHtml = fields.map(([key, obj]) => {
					const label = key.split('_').join(' ');
					const disabled = obj.allowEditExternal ? '' : 'disabled';
					let control;
					if (Array.isArray(obj.options) && obj.options.length > 0) {
						control = `<select class="mono" data-setting="${key}" ${disabled} onchange="saveSetting('${key}', this.value)">` +
							obj.options.map(([k, v]) => `<option value="${v}" ${v === obj.value ? 'selected' : ''}>${k}</option>`).join('') +
							`</select>`;
					} else {
						control = `<input type="text" class="mono" data-setting="${key}" value="${String(obj.value ?? '').replace(/"/g, '&quot;')}" ${disabled} onchange="saveSetting('${key}', this.value)">`;
					}
					return `
						<div class="info-item">
							<span class="info-label">${label}</span>
							<span class="info-value">${control}</span>
						</div>
					`;
				}).join('');

				return `
					<div style="grid-column:1/-1;font-size: 0.8rem;text-transform:uppercase;color:#aaa;font-weight:600;border-bottom: 0.0625rem solid var(--border);margin-top: 0.5rem;padding-left: 0.5rem;padding-bottom: 0.1rem;">${groupLabel(groupKey)}</div>
					${fieldsHtml}
				`;
			}).join('');
		}

		async function saveSetting(name, value) {
			try {
				const res = await fetch(`/api/v2/device/${device.id}/setting`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ name, value })
				});
				if (res.ok) {
					toast.success(`Updated ${name.split('_').join(' ')}`);
				} else {
					toast.error(`Failed to update ${name.split('_').join(' ')}`);
				}
			} catch (e) {
				toast.error('Error updating setting');
			}
		}

				installBtn.hidden = !hasUpdate;
				installBtn.disabled = !hasUpdate;

			renderVersionInfo('deviceVersionInfo', device.settings);

		/**
		 *  Overlay Image — matches the file-upload flow in
		 *  Client__v3_1_0/public/system.js (base64 data URI + metadata).
		 */
		let overlayUploadCommand = null;

		function updateOverlayPreview() {
			const previewEl = document.getElementById('overlayPreview');
			if (!previewEl) return;
			const overlaySetting = getSetting('media_overlay_image');
			try {
				const parsed = overlaySetting && overlaySetting.value ? JSON.parse(overlaySetting.value) : null;
				previewEl.src = parsed && parsed.src ? parsed.src : '';
			} catch {
				previewEl.src = '';
			}
		}

		function handleOverlayFile() {
			const uploaderEl = document.getElementById('overlayUpload');
			const file = uploaderEl.files[0];
			if (!file || !file.type.startsWith('image/')) return;

			const reader = new FileReader();
			reader.onload = (e) => {
				overlayUploadCommand = {
					name: file.name || '',
					type: file.type || '',
					size: file.size || 0,
					dateLastModified: file.lastModified,
					dateUploaded: Date.now(),
					src: e.target.result,
				};
				document.getElementById('overlayPreview').src = e.target.result;
				document.getElementById('saveOverlayBtn').disabled = false;
			};
			reader.readAsDataURL(file);
		}

		async function saveOverlay() {
			if (!overlayUploadCommand) return;
			try {
				const res = await fetch(`/api/v2/device/${device.id}/overlay-image`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(overlayUploadCommand)
				});
				if (res.ok) {
					toast.success('Overlay image updated');
					document.getElementById('overlayUpload').value = '';
				} else {
					toast.error('Failed to update overlay image');
				}
			} catch (e) {
				toast.error('Error updating overlay image');
			}
		}

		async function resetOverlay() {
			overlayUploadCommand = { name: '', type: '', size: 0, dateLastModified: '', dateUploaded: '', src: '' };
			document.getElementById('overlayUpload').value = '';
			document.getElementById('overlayPreview').src = '';
			document.getElementById('saveOverlayBtn').disabled = true;
			try {
				await fetch(`/api/v2/device/${device.id}/overlay-image`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(overlayUploadCommand)
				});
				toast.success('Overlay image reset');
			} catch (e) {
				toast.error('Error resetting overlay image');
			}
		}

		/**
		 *  CEC TV controls — power/volume/input-switch buttons in Display

				} else {
					toast.warning('Failed to send CEC command');

			} catch (e) {
				toast.error('Error sending CEC command');
			}
		}

		async function selectSource(sourceName) {

		async function renameDevice() {
			const newName = await modal.prompt('Enter new device name:', device.name, 'Rename Device');
			if (!newName || newName === device.name) {
				toast.info('Device name will remain unchanged.');
				return;
			}

			try {
				const res = await fetch(`/api/device/${device.id}`, {
					method: 'PUT',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ deviceName: newName })
				});
				if (res.ok) {
					toast.success('Device renamed');
					loadDevice();
				} else {
					toast.error('Failed to rename device');
				}
			} catch (e) {
				toast.error('Error renaming device');
			}

		async function changeGroup() {
			// Build options list
			const options = [{ value: '', label: 'None (No Group)' }];
			groups.forEach(g => {
				options.push({ value: g.id, label: g.name });
			});

			// Find current group ID
			const currentGroup = groups.find(g => g.name === device.group);
			const currentGroupId = currentGroup ? currentGroup.id : '';

			const selected = await modal.select('Select a group for this device:', options, currentGroupId, 'Change Group');
			if (selected === null || selected === undefined) return;

			try {
				// If device was in a group, remove it
				if (currentGroup) {
					await fetch(`/api/group/${currentGroup.id}/remove-device`, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ deviceId: device.id })
					});
				}

				// If new group selected (not 'None'), add device to it
				if (selected) {
					const res = await fetch(`/api/group/${selected}/add-device`, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ deviceId: device.id })
					});

					if (res.ok) {
						const newGroup = groups.find(g => g.id === selected);
						toast.success(`Added to group "${newGroup.name}"`);
					} else {
						toast.error('Failed to add to group');
					}
				} else {
					toast.success('Removed from group');
				}

				loadDevice();
			} catch (e) {
				toast.error('Error changing group');
			}
		}

		async function shutdownDevice() {
			const confirmed = await modal.confirm('Are you sure you want to shutdown this device?', 'Shutdown Device', { danger: true, confirmText: 'Shutdown' });
			if (!confirmed) return;

			try {
				const res = await fetch(`/api/device/${device.id}/shutdown`, { method: 'POST' });
				if (res.ok) {
					toast.info('Shutdown command sent');
				} else {
					toast.error('Failed to send shutdown command');
				}
			} catch (e) {
				toast.error('Error sending shutdown command');
			}
		}

		async function rebootDevice() {
			const confirmed = await modal.confirm('Are you sure you want to reboot this device?', 'Reboot Device', { danger: true, confirmText: 'Reboot' });
			if (!confirmed) return;

			try {
				const res = await fetch(`/api/device/${device.id}/reboot`, { method: 'POST' });
				if (res.ok) {
					toast.info('Reboot command sent');
				} else {
					toast.error('Failed to send reboot command');
				}
			} catch (e) {
				toast.error('Error sending reboot command');
			}
		}

		async function forgetDevice() {
			const confirmed = await modal.confirm('Are you sure you want to forget this device? It can be re-added later.', 'Forget Device', { danger: true, confirmText: 'Forget' });
			if (!confirmed) return;

			try {
				const res = await fetch(`/api/device/${device.id}`, { method: 'DELETE' });
				if (res.ok) {
					toast.success('Device forgotten');
					setTimeout(() => window.location.href = '/', 500);
				} else {
					toast.error('Failed to forget device');
				}
			} catch (e) {
				toast.error('Error forgetting device');
			}
		}

		async function showNetworkSettings() {
			const config = await modal.prompt(
				'Network Configuration (JSON format)',
				JSON.stringify({
					mode: 'dhcp',
					staticIP: '',
					subnet: '255.255.255.0',
					gateway: '',
					dns: '8.8.8.8',
					wifiSSID: '',
					wifiPassword: ''
				}, null, 2),
				'Configure Network'
			);

			if (!config) return;

			try {
				const networkConfig = JSON.parse(config);
				const res = await fetch(`/api/device/${device.id}/network`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(networkConfig)
				});

				if (res.ok) {
					toast.success('Network settings sent to device. Device may reconnect with new IP.');
				} else {
					toast.error('Failed to apply network settings');
				}
			} catch (e) {
				toast.error('Invalid JSON format');
			}
		}

		loadDevice();

		// Initialize WebSocket connection
		const ws = initWebSocket();

		// Handle device updates pushed from the Hub's own /ws (GUI) socket.
		// Every Client pushes its full settings snapshot to the Hub over the
		// persistent /ws/client connection roughly every 5s (+ on change),
		// and the Hub relays the current device list to every connected
		// browser here. connectDeviceSockets() below supplements this with
		// a direct browser-to-device connection for true real-time pushes
		// (the device's own /ws/system broadcasts the instant anything
		// changes, and /ws/stats streams every ~1s) — this handler stays as
		// the fallback/baseline and is what keeps Hub-only fields (group,
		// online/offline status) current either way.
		ws.onDevicesUpdate = (devices) => {
			if (!device) return;
			const updatedDevice = devices.find(d => d.id === device.id);
			if (!updatedDevice) return;

			// Compare everything except systemStats/clockSync/rawStats (all
			// three legitimately change on almost every broadcast/direct-socket
			// tick, and none of them exist on `updatedDevice` -- the Hub relay
			// only ever reports summarized systemStats, never clockSync or the
			// raw /ws/stats payload) without mutating either object, so a
			// stats-only tick updates just the stats header instead of
			// triggering a full re-render, and a real change still carries its
			// systemStats through intact. clockSync/rawStats only ever come
			// from the direct /ws/stats socket (see applyDeviceRawStats()), so
			// carry the existing values forward instead of losing them (and,
			// left in `oldRest`, rawStats would never match `newRest` -- which
			// never has that key -- making `otherChanged` true on every single
			// tick once it was first set).
			//
			// Also strip lastSeen/lastStatusUpdate (the Hub stamps both with
			// `new Date()` on literally every client-status report) and
			// ndiInfo.uptime (ticks up every second a stream is connected) --
			// left in, these made `otherChanged` true on almost every ~5s
			// tick, forcing a full settings-grid rebuild (via updateDevice()
			// -> renderSettings()) constantly and making it impossible to
			// edit a setting before the next tick wiped the input.
			const { systemStats: oldStats, clockSync: oldClockSync, rawStats: oldRawStats, lastSeen: _oLS, lastStatusUpdate: _oLSU, ndiInfo: oldNdiInfo, ...oldRest } = device;
			const { systemStats: newStats, lastSeen: _nLS, lastStatusUpdate: _nLSU, ndiInfo: newNdiInfo, ...newRest } = updatedDevice;
			const stripUptime = (info) => info ? { ...info, uptime: undefined } : info;

			const statsChanged = JSON.stringify(oldStats) !== JSON.stringify(newStats);
			const otherChanged = JSON.stringify(oldRest) !== JSON.stringify(newRest)
				|| JSON.stringify(stripUptime(oldNdiInfo)) !== JSON.stringify(stripUptime(newNdiInfo));

			// Prefer the freshest stats we already have (kept live by the
			// direct /ws/stats socket, ~1s cadence) over this ~5s relay
			// snapshot, which is staler and would otherwise make the header
			// visibly flash back to an older value every tick. Fall back to
			// the relay's value only if we don't have one yet. rawStats has
			// no relay equivalent at all, so it's always just carried forward.
			device = { ...updatedDevice, systemStats: oldStats || newStats, clockSync: oldClockSync, rawStats: oldRawStats };

			if (otherChanged) {
				updateDevice();
			} else if (statsChanged) {
				updateStatsHeader();
			}
		};

		/**
		 *  NDI source list -- a direct connection to the Hub's own
		 *  /ws/sources (same origin, not a per-device socket) instead of a
		 *  message type on the shared /ws GUI socket. Mirrors exactly how
		 *  Client__v3_1_0's own local system.js UI gets its source list:
		 *  the Hub keeps a long-running `ndpi_discover` subprocess going
		 *  and pushes its output straight through on connect (a snapshot,
		 *  favorites already merged in) and again every time the process
		 *  reports a change -- no polling, no separate periodic broadcast.
		 */
		let sourcesSocket = null;
		let sourcesReconnectTimer = null;
		function connectSourcesSocket() {
			const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
			sourcesSocket = new WebSocket(`${protocol}//${window.location.host}/ws/sources`);

			sourcesSocket.onmessage = (event) => {
				try {
					const sourcesUpdate = JSON.parse(event.data);
					if (Array.isArray(sourcesUpdate) && JSON.stringify(sources) !== JSON.stringify(sourcesUpdate)) {
						sources = sourcesUpdate;
						if (device) { renderSources(); }
					}
				} catch (e) {
					console.error('Invalid /ws/sources message:', e);
				}
			};
			sourcesSocket.onclose = () => {
				clearTimeout(sourcesReconnectTimer);
				sourcesReconnectTimer = setTimeout(connectSourcesSocket, 5000);
			};
			sourcesSocket.onerror = () => { };
		}
		connectSourcesSocket();

		/**
		 *  Direct-to-device live sockets — connects this browser straight to
		 *  the device itself (Client__v3_1_0/service/client_api_server.js),
		 *  the same two sockets its own local system.js UI uses:
		 *    - /ws/system: sends the full settings snapshot
		 *      (Array.from(fileMap), same [key,{value,group,...}] tuple shape
		 *      as `device.settings`) on connect, then re-sends it in full
		 *      the instant ANY setting changes (client_fs.js's
		 *      `fsData.on('update', ...)`) — pushed immediately, not on the
		 *      Hub's ~5s status-report cadence.
		 *    - /ws/stats: sends raw os.*-derived stats on connect, then
		 *      every ~1s. NOT the same shape as `device.systemStats` — the
		 *      summarized {cpu,memory,temperature,uptime} shape shown in the
		 *      stats header is derived from these raw fields below.
		 *  Requires this browser to be able to reach the device's IP
		 *  directly (same network), unlike the Hub-relayed `ws.onDevicesUpdate`
		 *  above, which stays wired as a fallback and for Hub-only fields.
		 */
		let deviceSystemSocket = null;
		let deviceStatsSocket = null;
		const deviceSocketReconnectTimers = {};

		function getDeviceApiPort() {
			const portSetting = getSetting('local_port_number_api');
			return (portSetting && portSetting.value) || 3080;
		}

		function connectDeviceSockets() {
			if (!device || !device.ip) return;
			const port = getDeviceApiPort();
			connectDeviceSystemSocket(device.ip, port);
			connectDeviceStatsSocket(device.ip, port);
		}

		function deviceSocketProtocol() {
			return window.location.protocol === 'https:' ? 'wss:' : 'ws:';
		}

		function connectDeviceSystemSocket(ip, port) {
			try { deviceSystemSocket && deviceSystemSocket.close(); } catch (e) { }

			deviceSystemSocket = new WebSocket(`${deviceSocketProtocol()}//${ip}:${port}/ws/system`);

			deviceSystemSocket.onmessage = (event) => {
				try {
					const tuples = JSON.parse(event.data);
					if (Array.isArray(tuples)) { applyDeviceSettingsTuples(tuples); }
				} catch (e) {
					console.error('Invalid /ws/system message from device:', e);
				}
			};
			deviceSystemSocket.onclose = () => {
				clearTimeout(deviceSocketReconnectTimers.system);
				deviceSocketReconnectTimers.system = setTimeout(() => connectDeviceSystemSocket(ip, port), 5000);
			};
			deviceSystemSocket.onerror = () => { };
		}

		function connectDeviceStatsSocket(ip, port) {
			try { deviceStatsSocket && deviceStatsSocket.close(); } catch (e) { }

			deviceStatsSocket = new WebSocket(`${deviceSocketProtocol()}//${ip}:${port}/ws/stats`);

			deviceStatsSocket.onmessage = (event) => {
				try {
					applyDeviceRawStats(JSON.parse(event.data));
				} catch (e) {
					console.error('Invalid /ws/stats message from device:', e);
				}
			};
			deviceStatsSocket.onclose = () => {
				clearTimeout(deviceSocketReconnectTimers.stats);
				deviceSocketReconnectTimers.stats = setTimeout(() => connectDeviceStatsSocket(ip, port), 5000);
			};
			deviceStatsSocket.onerror = () => { };
		}

		/**
		 * Apply a fresh Array.from(fileMap) snapshot pushed directly from the
		 * device's own /ws/system, deriving the same
		 * currentSource/displayMode/streamStatus/ndiInfo fields the Hub
		 * relay normally only refreshes every ~5s.
		 */
		function applyDeviceSettingsTuples(tuples) {
			if (!device) return;
			device.settings = tuples;

			const getValue = (key) => {
				const entry = tuples.find(([k]) => k === key);
				return entry ? entry[1].value : undefined;
			};

			if (getValue('device_name') !== undefined) { device.name = getValue('device_name') || device.name; }
			if (getValue('ndpi_status_ndi_source_target') !== undefined) { device.currentSource = getValue('ndpi_status_ndi_source_target') || 'None'; }
			if (getValue('ndpi_status_no_source_display_mode') !== undefined) { device.displayMode = getValue('ndpi_status_no_source_display_mode') || 'overlay'; }
			if (getValue('ndpi_status_ndi_status') !== undefined) { device.streamStatus = getValue('ndpi_status_ndi_status') || 'idle'; }

			const connectedTime = getValue('ndpi_status_ndi_source_connected_time') || '';
			device.ndiInfo = {
				resolution: getValue('ndpi_status_ndi_source_resolution') || '',
				framerate: parseFloat(getValue('ndpi_status_ndi_source_framerate')) || 0,
				displayName: getValue('output_display_model') || getValue('output_display_manufacturer') || '',
				displayResolution: getValue('output_display_resolution_current') || '',
				uptime: connectedTime ? Math.max(0, Math.floor((Date.now() - new Date(connectedTime).getTime()) / 1000)) : 0,
			};

			renderSources();
			updateDevice();
		}

		/**
		 * Apply a raw /ws/stats payload (client_api_server.js's
		 * getSystemStats() — plain os.* fields: loadavg, cpus, freemem,
		 * totalmem, osUptime, thermal.thermal_zone0 — not the summarized
		 * shape device.systemStats normally holds), converting it into that
		 * {cpu,memory,temperature,uptime} shape for display.
		 */
		function applyDeviceRawStats(raw) {
			if (!device || !Array.isArray(raw.loadavg) || !Array.isArray(raw.cpus) || !raw.totalmem) return;

			const totalMem = raw.totalmem;
			const usedMem = totalMem - raw.freemem;

			device.systemStats = {
				...(device.systemStats || {}),
				cpu: Math.round(Math.min(raw.loadavg[0] / raw.cpus.length, 1) * 1000) / 10,
				memory: {
					percent: Math.round((usedMem / totalMem) * 100),
					used: Math.round((usedMem / 1024 / 1024 / 1024) * 10) / 10,
					total: Math.round((totalMem / 1024 / 1024 / 1024) * 10) / 10,
				},
				temperature: (raw.thermal && raw.thermal.thermal_zone0) || 0,
				uptime: typeof raw.osUptime === 'number' ? raw.osUptime : (device.systemStats && device.systemStats.uptime) || 0,
			};

			// Clock sync: raw.systemTime is the device's own `String(new Date())`.
			// diffSeconds > 0 means this browser's clock is ahead of the device.
			if (raw.systemTime) {
				const deviceTime = new Date(raw.systemTime).getTime();
				if (!isNaN(deviceTime)) {
					const diffSeconds = (Date.now() - deviceTime) / 1000;
					device.clockSync = { diffSeconds, inSync: Math.abs(diffSeconds) <= 3 };
				}
			}

			device.rawStats = raw;

			updateStatsHeader();
			renderFullStats();
		}

		/**
		 * Renders every field from the device's raw /ws/stats payload (see
		 * applyDeviceRawStats() above) -- the summarized {cpu,memory,
		 * temperature,uptime} shown in the stats header only surfaces four
		 * numbers; this shows everything else the device reports too
		 * (host/OS info, per-source load average, fan speed, network
		 * interfaces, etc). Only populated once the direct-to-device
		 * /ws/stats socket has delivered at least one message -- the
		 * Hub-relayed ~5s status report doesn't carry these raw fields.
		 */
		function formatBytesGB(bytes) {
			return `${Math.round((bytes / 1024 / 1024 / 1024) * 10) / 10} GB`;
		}

		function renderFullStats() {
			const grid = document.getElementById('fullStatsGrid');
			if (!grid) return;

			const raw = device && device.rawStats;
			if (!raw) {
				grid.innerHTML = '<p style="color:#888;grid-column:1/-1;">Full stats require a direct connection to the device (same network as this browser) -- waiting to connect...</p>';
				return;
			}

			const items = [];
			items.push(['System Time', raw.systemTime || 'Unknown']);
			items.push(['Hostname', raw.hostname || 'Unknown']);
			items.push(['OS Uptime', formatUptime(raw.osUptime)]);
			items.push(['OS Platform', raw.osPlatform || 'Unknown']);
			items.push(['OS Release', raw.osRelease || 'Unknown']);
			items.push(['OS Version', raw.osVersion || 'Unknown']);
			items.push(['Architecture', raw.osArchitecture || 'Unknown']);
			items.push(['Machine', raw.osMachine || 'Unknown']);

			if (Array.isArray(raw.cpus) && raw.cpus.length > 0) {
				items.push(['CPU Model', raw.cpus[0].model || 'Unknown']);
				items.push(['CPU Cores', String(raw.cpus.length)]);
			}
			if (Array.isArray(raw.loadavg)) {
				items.push(['Load Avg (1/5/15m)', raw.loadavg.map((n) => n.toFixed(2)).join(' / ')]);
			}
			if (typeof raw.totalmem === 'number' && typeof raw.freemem === 'number') {
				items.push(['Memory Used', `${formatBytesGB(raw.totalmem - raw.freemem)} / ${formatBytesGB(raw.totalmem)}`]);
				items.push(['Memory Free', formatBytesGB(raw.freemem)]);
			}
			if (raw.thermal) {
				if (typeof raw.thermal.thermal_zone0 === 'number') {
					const tempF = ((raw.thermal.thermal_zone0 * 9 / 5) + 32).toFixed(0);
					items.push(['Temperature', `${raw.thermal.thermal_zone0.toFixed(1)}°C (${tempF}°F)`]);
				}
				items.push(['Fan Speed', `${typeof raw.thermal.fan1_input === 'number' ? raw.thermal.fan1_input : 0} RPM`]);
			}
			if (raw.networkInterfaces) {
				const addresses = Object.entries(raw.networkInterfaces)
					.flatMap(([name, entries]) => (entries || [])
						.filter((e) => e.family === 'IPv4' && !e.internal)
						.map((e) => `${name}: ${e.address}`));
				if (addresses.length > 0) { items.push(['Network Interfaces', addresses.join(', ')]); }
			}

			grid.innerHTML = items.map(([label, value]) => `
				<div class="info-item">
					<span class="info-label">${label}</span>
					<span class="info-value mono">${String(value).replace(/</g, '&lt;')}</span>
				</div>
			`).join('');
		}

		window.addEventListener('beforeunload', () => {
			try { deviceSystemSocket && deviceSystemSocket.close(); } catch (e) { }
			try { deviceStatsSocket && deviceStatsSocket.close(); } catch (e) { }
			clearTimeout(sourcesReconnectTimer);
			try { sourcesSocket && sourcesSocket.close(); } catch (e) { }
		});

	</script>
</body>

</html>
