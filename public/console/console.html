			<div class="content" style="overflow:hidden;">

				<section class="dashboard" style="flex: 1;">
					<div class="card" style="grid-column: 1 / -1;">
						<div class="card-content" style="gap: 1vh;">
							<div id="console-viewer"
								style="display: flex; flex: 1; flex-direction: column; justify-content: end; overflow: scroll; scrollbar-width: none;">
							</div>
							<div class="form-input" id="promptContainer"
								style="display: flex; align-items: center; padding-right: 0.625rem; gap: 0.625rem;">
								<div id="pwd-label"
									style="font-family: 'Courier New', Courier, monospace; letter-spacing: 0.0312rem; font-size: 0.75rem; text-align: end; width: min-content;  text-wrap-mode: nowrap;">
									~ $</div>
								<input id="promptIn" type="text" class="console-input"
									style="border-left-color: rgba(0, 0, 0, 0) !important; border-left-width: 0.125rem !important;"
									autocorrect="off" autocapitalize="off"></input>

						</div>

				</section>
			</div>
		</div>

	<script src="/scripts/ws-console.js"></script>
	<script src="/scripts/functions.js"></script>
	<script>

		(async () => {
			applyActiveNav('navConsole');
		})();

		async function initPage(account) {
			if (!account) return;

			const ws = initConsole();

			const promptEl = document.getElementById('promptIn');

			promptEl.addEventListener('change', (e) => {
				promptEl.style.setProperty(
					'border-left-color',
					'rgba(0, 0, 0, 0)',
					'important'
				);
			})

			promptEl.addEventListener('keydown', function (e) {
				promptEl.style.setProperty(
					'border-left-color',
					'rgba(0, 0, 0, 0)',
					'important'
				);
				if (e.key === 'Enter') {
					e.preventDefault();
					sendCommand();
				}
			});

			document.addEventListener('keydown', (e) => {

				// Clear Console
				if (e.key === 'k' && e.metaKey) {
					const consoleEl = document.getElementById('console-viewer');
					if (!consoleEl) return;
					const connectionLine = consoleEl.firstChild;
					consoleEl.innerHTML = '';
					consoleEl.appendChild(connectionLine);
					return;
				}

				// Kill Process
				if (e.key === 'c' && e.ctrlKey) {
					killProcess();
					return;
				}

				// Paste Text
				if (e.key === 'v' && e.ctrlKey) {
					pasteText();
					return;
				}

				if (
					e.ctrlKey ||
					e.metaKey ||
					e.altKey ||
					e.key.startsWith('F')
				) return;

				// Focus Prompt TB on type start
				if (e.code.startsWith('Key') && document.activeElement !== promptEl) {
					promptEl.focus();
				}

			});

			setInterval(() => {
				if (document.activeElement === promptEl || promptEl.value !== '' || promptEl.disabled) {
					promptEl.style.setProperty(
						'border-left-color',
						'rgba(0, 0, 0, 0)',
						'important'
					);
					return;
				}
				promptEl.style.setProperty(
					'border-left-color',
					'rgba(129, 193, 39, 1)',
					'important'
				);
				setTimeout(() => {
					promptEl.style.setProperty(
						'border-left-color',
						'rgba(0, 0, 0, 0)',
						'important'
					);
				}, 500);
			}, 1000);

			document.addEventListener("visibilitychange", () => {
				if (document.visibilityState === "visible") {
					promptEl.focus();
				}
			});
		}

		async function pasteText() {
			try {
				const val = await navigator.clipboard.readText();
				document.getElementById('promptIn').value = val;
			} catch { }
		}


	</script>
</body>

</html>
