<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="/styles.css">
	<script src="/scripts/auth.js"></script>
	<script src="/scripts/ws-client.js"></script>
	<script src="/scripts/ws-devices.js"></script>
	<script src="/scripts/modal.js"></script>
	<script src="/scripts/screen-saver.js"></script>
	<title>NDPi Monitor</title>
	<link rel="icon" type="image/svg+xml" href="/media/favicon.svg">
</head>
<body class="hide-scrollbar">
	<div id="wallpaper"></div>
	<div id="main-div" class="app">
		<div class="topbar">
			<div class="topbar-spacer"></div>
			<!--button onclick="window.location.href='/account-settings.html'" class="button-logged-in-acct" id="accountButton">
				<span id="navAccount"></span>
			</button-->
			<div onclick="window.location.href='/'" class="topbar-logo" id="topbarLogo"></div>
		</div>
		
		<div class="bottombar">
			<div class="bottombar-nav">
				<button id="navDashboard" class="nav-btn"></button>
				<button id="navDevices" class="nav-btn"></button>
				<button id="navGroups" class="nav-btn"></button>
				<button id="navSettings" class="nav-btn"></button>
				<button id="navAccount" class="nav-btn"></button>
			</div>
		</div>

		<section class="dashboard">
			<!-- Connected Devices Section -->
			<div class="card">
				<h2>Connected Devices</h2>
				<div class="card-content">
					<div id="devicesList" class="devices-grid">
						<!-- Device tiles will be rendered here -->
					</div>
				</div>
			</div>

			<!-- System Stats Section -->
			<div class="card">
				<h2 id="sys-status">Getting System Stats...</h2>
				<div class="card-content" id="systemStats">
					<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: 13px;">
						<div>
							<div style="color: #eee; margin-bottom: 8px; font-weight: 600;">CPU Usage</div>
							<div style="display: flex; align-items: center; gap: 8px;">
								<div style="flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden;">
									
									<div id="cpu-use-bar" style="transition: width 5s ease, background 2s ease; height: 100%; background: inherit; width: 0px;"></div>

								</div>
								<span id="cpu-use-value" style="color: inherit; font-weight: 600; min-width: 45px;"></span>
							</div>
						</div>
						<div>
							<div style="color: #eee; margin-bottom: 8px; font-weight: 600;">CPU Temp</div>
							<div style="display: flex; align-items: center; gap: 8px;">
								<div style="flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden;">

									<div id="cpu-temp-bar" style="transition: width 5s ease, background 2s ease; height: 100%; background: inherit; width: 0px;"></div>

								</div>

								<span id="cpu-temp-value" style="color: inherit; font-weight: 600; min-width: 45px;"></span>

							</div>
						</div>
						<div>
							<div style="color: #eee; margin-bottom: 8px; font-weight: 600;">Memory</div>
							<div style="display: flex; align-items: center; gap: 8px;">
								<div style="flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden;">

									<div id="memory-use-bar" style="transition: width 5s ease, background 2s ease; height: 100%; background: inherit; width: 0px;"></div>

								</div>

								<span id="memory-use-value" style="color: inherit; font-weight: 600; min-width: 45px;"></span>

							</div>
							<div id="memory-use-ratio" style="color: #888; font-size: 11px; margin-top: 2px;">-.- GB / -.- GB</div>
						</div>
						<div>
							<div style="color: #eee; margin-bottom: 8px; font-weight: 600;">Disk Usage</div>
							<div style="display: flex; align-items: center; gap: 8px;">
								<div style="flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden;">

									<div id="disk-use-bar" style="transition: width 5s ease, background 2s ease; height: 100%; background: inherit; width: 0px;"></div>

								</div>
								<span id="disk-use-value" style="color: inherit; font-weight: 600; min-width: 45px;"></span>
							</div>
						</div>
						<div>
							<div style="color: #eee; margin-bottom: 8px; font-weight: 600;">Load Average</div>
							<div id="load-average" style="color: #888; font-size: 12px;">
								-.-- / -.-- / -.--
							</div>
							<div style="color: #888; font-size: 11px; margin-top: 2px;">1m / 5m / 15m</div>
						</div>
					</div>
				</div>
			</div>
			
			
			<!-- Groups Section -->
			<div class="card">
				<h2>Display Groups</h2>
				<div class="card-content">
					<div id="groupsList" class="devices-grid">
						<!-- Device tiles will be rendered here -->
					</div>
				</div>
			</div>

			<!-- Test Resolution Section -->
			<div class="card">
				<h2>Resolution</h2>
				<div class="card-content">
					<button onclick="setResolution('HDMI-1', '1920x1080', '60')" class="button-primary">1920x1080</button>
					<button onclick="setResolution('HDMI-1', '2560x1440', '60')" class="button-primary">2560x1440</button>
					<button onclick="setResolution('HDMI-1', '3840x2160', '60')" class="button-primary">3840x2160</button>
				</div>
			</div>
		</section>
	</div>
	<script src="/scripts/functions.js"></script>

	
	<script>
		async function setResolution(output, resolution, rate) {
			let body = {};
			if (output) body.output = output;
			if (resolution) body.resolution = resolution;
			if (rate) body.rate = rate;
			try {
				if (!body) throw new Error('Resolution Not Provided');
				const res = await fetch('/api/resolution', { 
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(body),
				});
				
				if (!res.ok) {
					const err = await res.json();
					throw new Error(err.message);		
				} else {
					const resData = await res.json();
					toast.success(resData.message);
				}
			} catch (err) {
				toast.error(`${err}`)
			}
		}
	</script>


	<script>
		
		(() => {
			applyActiveNav('navDashboard');
		})();

		let devices = [];
		let groups = [];

		// Fetch Groups
		async function fetchGroups() {
			try {
				const res = await fetch('/api/groups');
				const data = await res.json();
				groups = data.groups || [];
				renderGroups();
			} catch (e) {
				groups = [];
				renderGroups();
			}
		}

		// Render Groups (patch existing tiles in place instead of rebuilding)
		const groupTiles = new Map(); // groupId -> tile refs

		function createGroupTile() {
			const tile = document.createElement('div');
			tile.className = 'group-tile';
			tile.innerHTML = `
				<h2 style='flex: 1;'></h2>
				<div class="group-devices" style="flex: 1; text-align: center;"></div>
				<div style="font-size:100%; overflow:hidden; flex: 3; text-align: right; max-width: 100%; display: flex; flex-direction: column; gap: 5px;">
					<font style="color:#888; text-align: right;">
						Current Source
					</font>
					<font class="mono"></font>
				</div>
			`;
			return {
				root: tile,
				name: tile.querySelector('h2'),
				deviceCount: tile.querySelector('.group-devices'),
				source: tile.querySelector('font.mono'),
			};
		}

		function updateGroupTile(refs, group) {
			refs.name.textContent = group.name;
			const deviceCount = group.devices ? group.devices.length : 0;
			refs.deviceCount.textContent = deviceCount === 1 ? '1 device' : `${deviceCount} devices`;
			refs.source.textContent = group.currentSource || 'None';
			refs.root.onclick = () => window.location.href = `/group.html?id=${encodeURIComponent(group.id)}`;
		}

		function renderGroups() {
			const list = document.getElementById('groupsList');

			if (groups.length === 0) {
				list.style.display = 'none';
				return;
			}

			list.style.display = 'flex';

			const seenIds = new Set();
			let prevRoot = null;

			groups.forEach(group => {
				seenIds.add(group.id);
				let refs = groupTiles.get(group.id);
				if (!refs) {
					refs = createGroupTile();
					groupTiles.set(group.id, refs);
					list.appendChild(refs.root);
				}
				updateGroupTile(refs, group);

				const desiredNext = prevRoot ? prevRoot.nextSibling : list.firstChild;
				if (desiredNext !== refs.root) { list.insertBefore(refs.root, desiredNext); }
				prevRoot = refs.root;
			});

			for (const [id, refs] of groupTiles) {
				if (!seenIds.has(id)) {
					refs.root.remove();
					groupTiles.delete(id);
				}
			}
		}


		// `deviceId -> tile refs`, patched in place instead of rebuilding on every update
		const deviceTiles = new Map();

		function createDeviceTile() {
			const tile = document.createElement('div');
			tile.className = 'device-card';
			tile.innerHTML = `
				<div class="device-card-header">
					<div class="device-card-identity">
						<span class="device-card-status-dot"></span>
						<div style="display:flex;flex-direction:column;min-width:0;">
							<span class="device-card-name"></span>
							<span class="device-card-status-text"></span>
						</div>
					</div>
					<span class="device-card-id mono"></span>
				</div>
				<div class="device-card-meta">
					<div class="device-card-meta-item">
						<span class="device-card-meta-label">Group</span>
						<span class="device-card-meta-value"></span>
					</div>
					<div class="device-card-meta-item">
						<span class="device-card-meta-label">IP Address</span>
						<span class="device-card-meta-value mono"></span>
					</div>
					<div class="device-card-meta-item wide">
						<span class="device-card-meta-label">Source</span>
						<span class="device-card-meta-value"></span>
					</div>
				</div>
				<div class="device-card-stats">
					<div class="device-card-stat"><span class="device-card-stat-label">CPU</span><span class="device-card-stat-value"></span></div>
					<div class="device-card-stat"><span class="device-card-stat-label">Temp</span><span class="device-card-stat-value"></span></div>
					<div class="device-card-stat"><span class="device-card-stat-label">Mem</span><span class="device-card-stat-value"></span></div>
				</div>
			`;
			const metaValues = tile.querySelectorAll('.device-card-meta-value');
			const statValues = tile.querySelectorAll('.device-card-stat-value');
			return {
				root: tile,
				name: tile.querySelector('.device-card-name'),
				statusText: tile.querySelector('.device-card-status-text'),
				id: tile.querySelector('.device-card-id'),
				group: metaValues[0],
				ip: metaValues[1],
				source: metaValues[2],
				stats: tile.querySelector('.device-card-stats'),
				cpu: statValues[0],
				temp: statValues[1],
				mem: statValues[2],
			};
		}

		function updateDeviceTile(refs, dev) {
			refs.root.dataset.status = dev.status === 'online' ? 'online' : 'offline';
			refs.name.textContent = dev.name;
			refs.name.title = dev.name;
			refs.statusText.textContent = dev.status;
			refs.id.textContent = dev.id;
			refs.group.textContent = dev.group || 'Ungrouped';
			refs.ip.textContent = dev.ip;
			const sourceText = (!dev.currentSource || String(dev.currentSource).toLowerCase() === 'none') ? 'None' : dev.currentSource;
			refs.source.textContent = sourceText;
			refs.source.title = sourceText;

			const showStats = !!(dev.systemStats && dev.status === 'online');
			refs.stats.style.display = showStats ? '' : 'none';
			if (showStats) {
				const cpuColor = dev.systemStats.cpu > 80 ? '#f87171' : dev.systemStats.cpu > 50 ? '#fbbf24' : '#4ade80';
				const memColor = dev.systemStats.memory.percent > 80 ? '#f87171' : dev.systemStats.memory.percent > 50 ? '#fbbf24' : '#4ade80';
				const tempColor = dev.systemStats.temperature > 78 ? '#f87171' : dev.systemStats.temperature > 65 ? '#fbbf24' : '#4ade80';
				const tempF = ((dev.systemStats.temperature * 9/5) + 32).toFixed(0);
				refs.cpu.textContent = `${dev.systemStats.cpu}%`;
				refs.cpu.style.color = cpuColor;
				refs.temp.textContent = `${tempF}°F`;
				refs.temp.style.color = tempColor;
				refs.mem.textContent = `${dev.systemStats.memory.percent}%`;
				refs.mem.style.color = memColor;
			}

			refs.root.onclick = () => window.location.href = `/device.html?id=${encodeURIComponent(dev.id)}`;
		}

		// Patch a single already-rendered tile in place -- used by the relay
		// callbacks below so a message about one device doesn't touch every
		// other card's DOM (createDeviceTile()/removal/reordering are only
		// relevant when the *set* of devices changes, not when one device's
		// stats/source update).
		function patchDeviceTile(deviceId) {
			const dev = devices.find(d => (d.id || d.deviceId) === deviceId);
			const refs = deviceTiles.get(deviceId);
			if (dev && refs) { updateDeviceTile(refs, dev); }
		}

		function renderDevices() {
			const list = document.getElementById('devicesList');
			if (!list) {
				console.error('devicesList element not found!');
				return;
			}

			const emptyMsg = list.querySelector('.no-devices-msg');
			if (devices.length === 0) {
				deviceTiles.forEach((refs) => refs.root.remove());
				deviceTiles.clear();
				if (!emptyMsg) { list.innerHTML = '<p class="no-devices-msg" style="color: #888; padding: 20px;">No devices added yet...</p>'; }
				return;
			}
			if (emptyMsg) { emptyMsg.remove(); }

			const seenIds = new Set();
			let prevRoot = null;

			devices.forEach(dev => {
				seenIds.add(dev.id);
				let refs = deviceTiles.get(dev.id);
				if (!refs) {
					refs = createDeviceTile();
					deviceTiles.set(dev.id, refs);
					list.appendChild(refs.root);
				}
				updateDeviceTile(refs, dev);

				const desiredNext = prevRoot ? prevRoot.nextSibling : list.firstChild;
				if (desiredNext !== refs.root) { list.insertBefore(refs.root, desiredNext); }
				prevRoot = refs.root;
			});

			for (const [id, refs] of deviceTiles) {
				if (!seenIds.has(id)) {
					refs.root.remove();
					deviceTiles.delete(id);
				}
			}
		}

		function addTouchScrollEventListener() {
			const list = document.getElementById('main-div');
			if (!list) return;
			
			let isTouching = false;
			let startY = 0;
			let scrollTop = 0;

			list.addEventListener('touchstart', (e) => {
				isTouching = true;
				startY = e.touches[0].clientY;
				scrollTop = list.scrollTop;
			}, { passive: true });

			list.addEventListener('touchmove', (e) => {
				if (!isTouching) return;
				const currentY = e.touches[0].clientY;
				const deltaY = startY - currentY;
				list.scrollTop = scrollTop + deltaY;
			}, { passive: true });

			list.addEventListener('touchend', () => {
				isTouching = false;
			});
		}

		// Initial load
		fetchGroups();
		addTouchScrollEventListener();

		const pageLogo = document.getElementById('topbarLogo');
		const topbarHeight = document.querySelector('.topbar').clientHeight;
		pageLogo.style.width = topbarHeight ? `${topbarHeight - 10}px` : `100px`;
		pageLogo.style.height = topbarHeight ? `${topbarHeight - 10}px` : `100%`;

		// Initialize WebSocket connection
		const ws = initWebSocket();

		// Handle device updates from WebSocket (also delivers a snapshot on connect,
		// so no /api/devices REST fetch is needed on this page)
		ws.onDevicesUpdate = (updatedDevices) => {
			// Preserve the freshest per-device stats (kept live by devicesStatsRelay,
			// ~1s cadence) instead of letting this ~5s Hub snapshot overwrite them
			// with a staler copy -- otherwise stats visibly flash between two
			// different values on every relay tick.
			const statsById = new Map(devices.map(d => [d.id, d.systemStats]));
			devices = updatedDevices.map(d => ({ ...d, systemStats: statsById.get(d.id) || d.systemStats }));
			renderDevices();
		};

		/**
		 *  This Hub's own live stats — connects directly to the Hub's
		 *  dedicated /ws/stats (service/hub_api_server.js) instead of the
		 *  ~5s-cadence system-stats message on the shared /ws GUI socket,
		 *  matching Client__v3_1_0's own local system.js pattern. The raw
		 *  os.*-derived payload is converted to the summarized shape
		 *  updateSystemStats() already expects.
		 */
		function deriveHubStats(raw) {
			if (!raw || !Array.isArray(raw.loadavg) || !Array.isArray(raw.cpus) || !raw.totalmem) return null;

			const totalMem = raw.totalmem;
			const usedMem = totalMem - raw.freemem;

			return {
				cpuUsage: Math.round(Math.min(raw.loadavg[0] / raw.cpus.length, 1) * 1000) / 10,
				cpuTemp: (raw.thermal && raw.thermal.thermal_zone0) || 0,
				memoryUsage: Math.round((usedMem / totalMem) * 100),
				memoryTotal: Math.round((totalMem / 1024 / 1024 / 1024) * 10) / 10,
				memoryUsed: Math.round((usedMem / 1024 / 1024 / 1024) * 10) / 10,
				diskUsage: 0,
				loadAverage: raw.loadavg,
				uptime: raw.osUptime,
			};
		}

		let hubStatsSocket = null;
		let hubStatsReconnectTimer = null;
		function connectHubStatsSocket() {
			const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
			hubStatsSocket = new WebSocket(`${protocol}//${window.location.host}/ws/stats`);

			hubStatsSocket.onmessage = (event) => {
				try {
					const derived = deriveHubStats(JSON.parse(event.data));
					if (derived) { updateSystemStats(derived); }
				} catch (e) {
					console.error('Invalid /ws/stats message:', e);
				}
			};
			hubStatsSocket.onclose = () => {
				clearTimeout(hubStatsReconnectTimer);
				hubStatsReconnectTimer = setTimeout(connectHubStatsSocket, 5000);
			};
			hubStatsSocket.onerror = () => {};
		}
		connectHubStatsSocket();

		/**
		 *  Multi-device relay — one Hub connection covers every device
		 *  tile's live stats/settings (see 01-scripts/ws-devices.js).
		 */
		const devicesStatsRelay = new NDPiDevicesRelay('stats', (cache, changedIds) => {
			// changedIds === null only on the initial snapshot/reconnect,
			// where every device is "new" and needs a full render; otherwise
			// it's exactly the devices that changed this tick, so only their
			// tiles get touched.
			const idsToApply = changedIds === null ? Object.keys(cache) : changedIds;
			let changed = false;
			idsToApply.forEach((id) => {
				const dev = devices.find(d => (d.id || d.deviceId) === id);
				const stats = cache[id];
				if (dev && stats) { dev.systemStats = stats; changed = true; }
			});
			if (!changed) return;
			if (changedIds === null) { renderDevices(); }
			else { changedIds.forEach(patchDeviceTile); }
		});

		const devicesSystemRelay = new NDPiDevicesRelay('system', (cache, changedIds) => {
			const idsToApply = changedIds === null ? Object.keys(cache) : changedIds;
			let changed = false;
			idsToApply.forEach((id) => {
				const dev = devices.find(d => (d.id || d.deviceId) === id);
				const currentSource = getRelayedSetting(cache[id], 'ndpi_status_ndi_source_target');
				if (dev && currentSource) { dev.currentSource = currentSource.value || 'None'; changed = true; }
			});
			if (!changed) return;
			if (changedIds === null) { renderDevices(); }
			else { changedIds.forEach(patchDeviceTile); }
		});

		window.addEventListener('beforeunload', () => {
			clearTimeout(hubStatsReconnectTimer);
			try { hubStatsSocket && hubStatsSocket.close(); } catch (e) {}
			devicesStatsRelay.close();
			devicesSystemRelay.close();
		});

		// Update system stats display
		function updateSystemStats(stats) {
			const cpuUseBar = document.getElementById('cpu-use-bar');
			const cpuUseValue = document.getElementById('cpu-use-value');
			const cpuTempBar = document.getElementById('cpu-temp-bar');
			const cpuTempValue = document.getElementById('cpu-temp-value');
			const memUseBar = document.getElementById('memory-use-bar');
			const memUseValue = document.getElementById('memory-use-value');
			const memUseRatio = document.getElementById('memory-use-ratio');
			const diskUseBar = document.getElementById('disk-use-bar');
			const diskUseValue = document.getElementById('disk-use-value');
			const loadAverage = document.getElementById('load-average');
			const initLoadMsg = document.getElementById('sys-status');

			if (!cpuUseBar || !cpuUseValue || !cpuTempBar || !cpuTempValue || !memUseBar || !memUseValue || !memUseRatio || !diskUseBar || !diskUseValue || !loadAverage) {
				console.error('One or more system stats elements not found!');
				return;
			}
			
			const cpuColor = stats.cpuUsage > 80 ? '#dc5050' : stats.cpuUsage > 60 ? '#ffa500' : 'rgb(129, 193, 39)';
			const memColor = stats.memoryUsage > 80 ? '#dc5050' : stats.memoryUsage > 60 ? '#ffa500' : 'rgb(129, 193, 39)';
			const diskColor = stats.diskUsage > 80 ? '#dc5050' : stats.diskUsage > 60 ? '#ffa500' : 'rgb(129, 193, 39)';
			const tempColor = stats.cpuTemp > 78 ? '#dc5050' : stats.cpuTemp > 65 ? '#ffa500' : 'rgb(129, 193, 39)';
			const tempF = ((stats.cpuTemp * 9/5) + 32).toFixed(0);
			/*
				40°C is low and 85°C is high
				Updated --	31.5°C is low
							76.5°C is high
			*/
			const tempHighLowPercent = (stats.cpuTemp - 31.5) / (76.5 - 31.5) * 100; 

			cpuUseBar.style.width = `${stats.cpuUsage}%`;
			cpuUseBar.style.background = cpuColor;
			cpuUseValue.textContent = `${stats.cpuUsage}%`;
			cpuUseValue.style.color = cpuColor;

			cpuTempBar.style.width = `${tempHighLowPercent}%`;
			cpuTempBar.style.background = tempColor;
			cpuTempValue.textContent = `${tempF}℉`;
			cpuTempValue.style.color = tempColor;

			memUseBar.style.width = `${stats.memoryUsage}%`;
			memUseBar.style.background = memColor;
			memUseValue.textContent = `${stats.memoryUsage}%`;
			memUseValue.style.color = memColor;
			memUseRatio.textContent = `${stats.memoryUsed}GB / ${stats.memoryTotal}GB`;

			diskUseBar.style.width = `${stats.diskUsage}%`;
			diskUseBar.style.background = diskColor;
			diskUseValue.textContent = `${stats.diskUsage}%`;
			diskUseValue.style.color = diskColor;

			loadAverage.textContent = `${stats.loadAverage[0].toFixed(2)} / ${stats.loadAverage[1].toFixed(2)} / ${stats.loadAverage[2].toFixed(2)}`;

			if (initLoadMsg) {
				initLoadMsg.textContent = 'System Stats';
			}
			
			/*
			container.innerHTML = `
				<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: 13px;">
					<div>
						<div style="color: #eee; margin-bottom: 8px; font-weight: 600;">CPU Usage</div>
