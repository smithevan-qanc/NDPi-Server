		<section class="dashboard">
			<div class="card" style="grid-column: 1 / -1;">
				<h2>User Management</h2>
				<div class="card-content">
					<div class="devices-grid" id="usersList"></div>
					
					<!-- No Users Message -->
					<div id="noUsersMessage" style="text-align: center; padding: 2.5rem; color: #888; display: none;">
						<p>No users found</p>
						<p style="font-size: 0.875rem; margin-top: 0.5rem;">Click the "+" button to create a new user</p>
					</div>
				</div>
			</div>
		</section>
		
		<!-- Floating Action Button -->
		<div class="floating-actions">
			<button class="fab" id="add-button" title="Create User">
				<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-lg" viewBox="0 0 16 16">
					<path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/>
				</svg>
			</button>

			</div>
		</div>
	</div>
	<script src="/scripts/functions.js"></script>
	<script>
		
		(() => {
			applyActiveNav('navUsers');
		})();

		// Global variables
		let users = [];

		// Toggle admin privileges (`account` is the logged-in user, set by
		// auth.js's loadUserAccount() via 01-scripts/functions.js's bootstrap)
		async function toggleAdminPrivileges(userId, isCurrentlyAdmin) {
			if (!account || !account.isAdmin) {
				toast.error('Only admin users can manage privileges');
				return;
			}

			const action = isCurrentlyAdmin ? 'revoke' : 'grant';
			const confirmMessage = `Are you sure you want to ${action} admin privileges ${isCurrentlyAdmin ? 'from' : 'to'} this user?`;

			const confirmed = await modal.confirm(confirmMessage, 'Change Admin Privileges', { danger: isCurrentlyAdmin, confirmText: isCurrentlyAdmin ? 'Revoke' : 'Grant' });
			if (!confirmed) return;

			try {
				const res = await fetch(`/api/account/${userId}`, {
					method: 'PUT',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify({
						isAdmin: !isCurrentlyAdmin,
						requestorId: account.id
					})
				});

				const result = await res.json();

				if (res.ok) {
					toast.success(`Admin privileges ${action}ed`);
					fetchUsers(); // Refresh the users list
				} else {
					toast.error(result.error || 'Failed to update privileges');
				}
			} catch (e) {
				console.error('Error updating admin privileges:', e);
				toast.error('Error updating privileges');
			}
		}

		document.getElementById('add-button').addEventListener('click', () => {
			this.onclick = null;
			showCreateUserModal();
		});

		// Fetch Users
		async function fetchUsers() {
			try {
				const res = await fetch('/api/admin/accounts');
				const data = await res.json();
				users = data.accounts || [];
				renderUsers();
			} catch (e) {
				console.error('Error fetching users:', e);
				users = [];
				renderUsers();
			}
		}

		// Render Users
		function renderUsers() {
			const list = document.getElementById('usersList');
			const noUsersMsg = document.getElementById('noUsersMessage');
			
			list.innerHTML = '';
			
			if (users.length === 0) {
				noUsersMsg.style.display = 'block';
				return;
			}
			
			noUsersMsg.style.display = 'none';
			
			users.forEach(user => {
				const tile = document.createElement('div');
				tile.className = 'user-tile' + (user.isAdmin ? ' admin' : '');
				
				const createdDate = new Date(user.createdAt).toLocaleDateString();
				
				tile.innerHTML = `
					<strong>${user.firstName} ${user.lastName}</strong>
					${user.isAdmin ? '<span class="admin-badge">ADMIN</span>' : ''}
					<div class="user-info">
						<div>Username: ${user.username}</div>
						<div>Created: ${createdDate}</div>
					</div>
					${account && account.isAdmin && user.id !== account.id ? `
						<div class="admin-actions">
							<button onclick="toggleAdminPrivileges('${user.id}', ${user.isAdmin})" 
									class="admin-toggle-btn ${user.isAdmin ? 'revoke' : 'grant'}">
								${user.isAdmin ? 'Revoke Admin' : 'Grant Admin'}
							</button>
						</div>
					` : ''}
				`;
				
				list.appendChild(tile);
			});
		}

		// Create User Modal
		const showCreateUserModal = async () => {
			try {
				const firstName = await modal.prompt('Enter first name:', '', 'Create User', { placeholder: 'First name' });
				if (!firstName) return;
				
				const lastName = await modal.prompt('Enter last name:', '', 'Create User', { placeholder: 'Last name' });
				if (!lastName) return;
				
				const username = await modal.prompt('Enter username:', '', 'Create User', { placeholder: 'Username' });
				if (!username) return;
				
				const pin = await modal.prompt('Enter PIN (4 digits):', '', 'Create User', { 
					placeholder: '1234',
					inputMode: 'numeric'
				});
				if (!pin || pin.length !== 4 || !/^\d{4}$/.test(pin)) {
					toast.error('PIN must be exactly 4 digits');
					return;
				}
				
				const isAdmin = await modal.confirm('Should this user have admin privileges?', 'Admin Access');
				
				const response = await fetch('/api/account', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						firstName,
						lastName,
						username,
						pin,
						isAdmin
					})
				});
				
				if (response.ok) {
					toast.success('User created');
					await fetchUsers();
				} else {
					const error = await response.json();
					toast.error(error.error || 'Failed to create user');
				}
			} catch (e) {
				console.error('Error creating user:', e);
				toast.error('Error creating user');
			}
		};

		// Initialize WebSocket connection
		const ws = initWebSocket();


		// Initial load
		fetchUsers();

	</script>
