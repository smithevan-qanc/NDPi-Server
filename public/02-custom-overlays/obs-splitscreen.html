<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS Splitscreen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #242424;
        }

        /*
         *  
         *  NOTE:
         *  When calculating the radius for a container (inner) inside another container (outer):
         *  Border Radius(inner) = Border Radius(outer) - Border Width(outer)
         *  
         */
        .radius-outer {
            border-radius: 25px;
            border-width: 10px; /* thickness */
            padding: 0px;
            border-color: rgb(59, 190, 44);
            border-style: solid;
            box-sizing: border-box;
            animation: color-shift-a 5s infinite ;
        }

        .radius-inner {
            border-radius: 15px;
            border-width: 7px; /* thickness */
            border-color: rgb(220, 220, 220);
            border-style: solid;
            box-sizing: border-box;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.85);
            /* box-shadow: 0px 0px 30px -10px rgba(255, 255, 255, 0.9) inset, 0px 0px 10px rgba(0, 0, 0, 0.45); */
            animation: color-shift-b 30s infinite ;
        }

        #camera-container {
            position: absolute;
            height: 75vh;
            left: 15px;
            transform: translate(0%, 15%);
            aspect-ratio: 2 / 3;
        }

        #slides-container {
            position: absolute;
            height: 75vh;
            right: 15px;
            transform: translate(0%, 15%);
            aspect-ratio: 16 / 9.7;
        }

        @keyframes color-shift-a {
            0%   { border-color: rgb(129, 193, 39);  box-shadow: 0px 0px 30px -10px rgb(129, 193, 39) inset; }
            10%  { border-color: rgb(129, 193, 39);  box-shadow: 0px 0px 30px -10px rgb(129, 193, 39) inset; }
            15%  { border-color: rgb(255, 255, 255); box-shadow: 0px 0px 30px -10px rgb(255, 255, 255) inset; }
            25%  { border-color: rgb(255, 255, 255); box-shadow: 0px 0px 30px -10px rgb(255, 255, 255) inset; }
            30%  { border-color: rgb(129, 193, 39);  box-shadow: 0px 0px 30px -10px rgb(129, 193, 39) inset; }
            40%  { border-color: rgb(129, 193, 39);  box-shadow: 0px 0px 30px -10px rgb(129, 193, 39) inset; }
            45%  { border-color: rgb(255, 255, 255); box-shadow: 0px 0px 30px -10px rgb(255, 255, 255) inset; }
            55%  { border-color: rgb(255, 255, 255); box-shadow: 0px 0px 30px -10px rgb(255, 255, 255) inset; }
            60%  { border-color: rgb(129, 193, 39);  box-shadow: 0px 0px 30px -10px rgb(129, 193, 39) inset; }
            70%  { border-color: rgb(129, 193, 39);  box-shadow: 0px 0px 30px -10px rgb(129, 193, 39) inset; }
            75%  { border-color: rgb(255, 255, 255); box-shadow: 0px 0px 30px -10px rgb(255, 255, 255) inset; }
            85%  { border-color: rgb(255, 255, 255); box-shadow: 0px 0px 30px -10px rgb(255, 255, 255) inset; }
            90%  { border-color: rgb(129, 193, 39);  box-shadow: 0px 0px 30px -10px rgb(129, 193, 39) inset; }
            100% { border-color: rgb(129, 193, 39);  box-shadow: 0px 0px 30px -10px rgb(129, 193, 39) inset; }
        }
        
        @keyframes color-shift-b {
            0%   { border-color: rgb(255, 255, 255); }
            10%  { border-color: rgb(255, 255, 255); }
            15%  { border-color: rgb(129, 193, 39); }
            25%  { border-color: rgb(129, 193, 39); }
            30%  { border-color: rgb(255, 255, 255); }
            40%  { border-color: rgb(255, 255, 255); }
            45%  { border-color: rgb(129, 193, 39);  }
            55%  { border-color: rgb(129, 193, 39); }
            60%  { border-color: rgb(255, 255, 255); }
            70%  { border-color: rgb(255, 255, 255); }
            75%  { border-color: rgb(129, 193, 39);  }
            85%  { border-color: rgb(129, 193, 39); }
            90%  { border-color: rgb(255, 255, 255); }
            100% { border-color: rgb(255, 255, 255); }
        }
    </style>
</head>
