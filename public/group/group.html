	<script>

		(() => {
			applyActiveNav('navGroups');
			initGlobalHubStats();
		})();

		let group = null;
		let sources = [];
		let allDevices = [];
		let isInitialLoad = true;
		let groupRokuTvs = []; // Roku TVs for current group

		async function loadGroup() {
			const params = new URLSearchParams(window.location.search);
			const groupId = params.get('id');

			if (!groupId) {
				window.location.href = '/';
				return;
			}

			try {
				const [grpRes, devRes, rokuRes] = await Promise.all([
					fetch('/api/groups'),
					fetch('/api/devices'),
					fetch('/api/roku-tvs')
				]);

				const grpData = await grpRes.json();
				const devData = await devRes.json();
				const rokuData = await rokuRes.json();
				allDevices = devData.devices || [];

				group = grpData.groups.find(g => g.id === groupId);

				if (!group) {
					document.getElementById('groupContent').innerHTML = '<p style="color: #dc5050;">Group not found</p>';
					return;
				}

				// Filter Roku TVs for this group
				const allRokuTvs = rokuData.rokuTvs || [];
				groupRokuTvs = allRokuTvs.filter(tv => tv.groupId === groupId);

				// Enrich group devices with full device data
				group.devices = group.devices.map(gDev => {
					const fullDevice = allDevices.find(d => (d.id || d.deviceId) === (gDev.id || gDev.deviceId));
					return fullDevice ? { ...gDev, ...fullDevice } : gDev;
				});

				if (isInitialLoad) {
					renderGroup();
					startWave();
					isInitialLoad = false;
				} else {
					updateGroupDisplay();
				}
			} catch (e) {
				console.error('Error loading group:', e);
				document.getElementById('groupContent').innerHTML = '<p style="color: #dc5050;">Error loading group</p>';
			}
		}

		function parseNdiUrl(url) {
			if (!url) return { ip: 'Unknown', port: 'Unknown' };
			const match = url.match(/^(?:ndi:\/\/)?([^:\/]+)(?::(\d+))?/);
			if (match) {
				return { ip: match[1], port: match[2] || '5961' };
			}
			return { ip: url, port: '5961' };
		}

		function parseSourceName(name) {
			const match = name.match(/^(.+?)\s*\((.+)\)$/);
			if (match) {
				return { hostname: match[1], sourceName: match[2] };
			}
			return { hostname: name, sourceName: 'Default' };
		}

		// The Client stores 'no source selected' as a literal lowercase
		// 'none' string once a source has ever actively been cleared
		// (Client__v3_1_0/service/functions.js's 'set-source'/'ndi' handler
		// does `String(data || 'none')`), not just as an empty/falsy value —
		// so a per-device currentSource (dev.currentSource, sourced from
		// the device's own report) can be 'none' even though the checks
		// below only compared against the capitalized 'None' placeholder.
		function isNoSource(value) {
			const normalized = String(value ?? '').trim().toLowerCase();
			return normalized === '' || normalized === 'none';
		}

		/*
		const customMenu = document.getElementById("customMenu");

		function showCustomMenu(e) {
			e.preventDefault();
			customMenu.style.top = `${e.pageY}px`;
			customMenu.style.left = `${e.pageX}px`;
			customMenu.classList.add('active');
		}

		function hideCustomMenu() {
			customMenu.classList.remove('active');

		document.addEventListener("click", function(e) {
			if (!customMenu.contains(e.target)) {
				hideCustomMenu();
			}

		*/
		// Same stat-pill visual style as device/device.html's
		// updateStatsHeader(), so the two pages' headers look consistent
		// even though a group's own meaningful stats (device count, how
		// many online, assigned source) are different from a single
		// device's (CPU/temp/mem/uptime).
		function updateGroupHeaderStats() {
			document.getElementById('groupName').textContent = group.name;

			const statsHeader = document.getElementById('groupStats');
			if (!statsHeader) return;

			const total = group.devices.length;
			const online = group.devices.filter(d => d.status === 'online' || d.status === 'connected').length;
			const onlineColor = total === 0 ? '#888' : online === total ? '#4ade80' : online > 0 ? '#fbbf24' : '#f87171';

			const curSource = group.currentSource || 'None';
			const hasSource = !isNoSource(curSource);
			const sourceColor = hasSource ? 'rgb(129, 193, 39)' : '#888';
			const sourceLabel = hasSource ? curSource : '⸻⸻⸻';

			statsHeader.innerHTML = `
				<div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
					<span style="color:#888;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">Devices</span>
					<span style="color:#4ade80;font-weight:600;font-size:16px;">${total}</span>
				</div>
				<div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
					<span style="color:#888;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">Online</span>
					<span style="color:${onlineColor};font-weight:600;font-size:16px;">${online}/${total}</span>
				</div>
				<div style="display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;flex:2;">
					<span style="color:#888;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">Source</span>
					<span style="color:${sourceColor};font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;" title="${sourceLabel}">${sourceLabel}</span>
				</div>
			`;
		}
		function updateGroupDisplay() {
			updateGroupHeaderStats();

			const curSource = group.currentSource || 'None';

			// Update source selection highlights
			document.querySelectorAll('.source-card').forEach(card => {

				const sourceName = card.dataset.source;

				const isSelected = (sourceName === '' && isNoSource(curSource)) || sourceName === group.currentSource;

				card.classList.toggle('selected', isSelected);

				const badge = card.querySelector('.source-selected-badge');
				if (badge) badge.remove();

				if (isSelected) {
					const newBadge = document.createElement('div');
					newBadge.className = 'source-selected-badge';
					newBadge.style.background = sourceName === '' ? '#666' : 'rgb(129, 193, 39)';
					newBadge.textContent = 'Current';
					card.appendChild(newBadge);
				}
			});

			// Update devices list
			updateDevicesList();
			renderGroupNoSourceDisplayControl();
			renderGroupSettings();
		}

		// `deviceId -> tile refs`, patched in place instead of rebuilding on every update
		const groupDeviceTiles = new Map();

		function createGroupDeviceTile(dev) {
			const tile = document.createElement('div');
			tile.className = 'device-card';
			tile.dataset.deviceId = dev.id || dev.deviceId;
			tile.innerHTML = `
				<div class="device-card-header">
					<div class="device-card-identity">
						<span class="device-card-status-dot"></span>
						<div style="display:flex;flex-direction:column;min-width:0;">
							<span class="device-card-name"></span>
							<span class="device-card-status-text"></span>
						</div>
					</div>
				</div>
				<div class="device-card-meta">
					<div class="device-card-meta-item">
						<span class="device-card-meta-label">IP Address</span>
						<span class="device-card-meta-value mono"></span>
					</div>
					<div class="device-card-meta-item">
						<span class="device-card-meta-label">Source</span>
						<span class="device-card-meta-value"></span>
					</div>
					<div class="device-card-meta-item wide">
						<span class="device-card-meta-label">Display</span>
						<span class="device-card-meta-value"></span>
					</div>
					<div class="device-card-meta-item">
						<span class="device-card-meta-label">Resolution</span>
						<span class="device-card-meta-value mono"></span>
					</div>
					<div class="device-card-meta-item">
						<span class="device-card-meta-label">NDI Status</span>
						<span class="device-card-meta-value"></span>
					</div>
					<div class="device-card-meta-item">
						<span class="device-card-meta-label">Version</span>
						<span class="device-card-meta-value mono"></span>
					</div>
				</div>
				<div class="device-card-stats" style="display:none;">
					<div class="device-card-stat"><span class="device-card-stat-label">CPU</span><span class="device-card-stat-value"></span></div>
					<div class="device-card-stat"><span class="device-card-stat-label">Temp</span><span class="device-card-stat-value"></span></div>
					<div class="device-card-stat"><span class="device-card-stat-label">Mem</span><span class="device-card-stat-value"></span></div>
					<div class="device-card-stat"><span class="device-card-stat-label">Fan</span><span class="device-card-stat-value"></span></div>
				</div>
				<div class="device-card-actions">
					<button class="device-card-icon-btn" data-action="remove" style="display:none;" title="Remove from group">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
						<span class="device-card-icon-btn-label">Remove</span>
					</button>
					<button class="device-card-icon-btn" data-action="cec-on" title="TV Power On (CEC)">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"></path><path d="M18.4 6.6a9 9 0 1 1-12.77.04"></path></svg>
						<span class="device-card-icon-btn-label">Power On</span>
					</button>
					<button class="device-card-icon-btn danger" data-action="cec-off" title="TV Power Off (CEC)">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"></path><path d="M18.4 6.6a9 9 0 1 1-12.77.04"></path><path d="M4 4l16 16"></path></svg>
						<span class="device-card-icon-btn-label">Power Off</span>
					</button>
				</div>
			`;

			const metaValues = tile.querySelectorAll('.device-card-meta-value');
			const statValues = tile.querySelectorAll('.device-card-stat-value');

			const refs = {
				root: tile,
				statusText: tile.querySelector('.device-card-status-text'),
				nameSpan: tile.querySelector('.device-card-name'),
				ipValue: metaValues[0],
				sourceValue: metaValues[1],
				displayValue: metaValues[2],
				resolutionValue: metaValues[3],
				ndiStatusValue: metaValues[4],
				versionValue: metaValues[5],
				stats: tile.querySelector('.device-card-stats'),
				cpu: statValues[0],
				temp: statValues[1],
				mem: statValues[2],
				fan: statValues[3],
				removeButton: tile.querySelector('[data-action="remove"]'),
				cecOnButton: tile.querySelector('[data-action="cec-on"]'),
				cecOffButton: tile.querySelector('[data-action="cec-off"]'),
			};

			const deviceId = dev.id || dev.deviceId;
			refs.root.onclick = () => window.location.href = `/device.html?id=${encodeURIComponent(deviceId)}`;
			refs.cecOnButton.onclick = (e) => { e.stopPropagation(); cecPowerOn(deviceId); };
			refs.cecOffButton.onclick = (e) => { e.stopPropagation(); cecPowerOff(deviceId); };

			return refs;
		}

		function updateGroupDeviceTile(refs, dev) {
			const deviceId = dev.id || dev.deviceId;

			refs.root.dataset.status = dev.status === 'online' ? 'online' : 'offline';
			refs.statusText.textContent = dev.status;
			refs.nameSpan.textContent = dev.name;
			refs.nameSpan.title = dev.name;
			refs.ipValue.textContent = dev.ip;

			const sourceText = isNoSource(dev.currentSource) ? 'No Active Source' : dev.currentSource;
			refs.sourceValue.textContent = sourceText;
			refs.sourceValue.title = sourceText;

			const cardFields = getDeviceCardFields(getDeviceSettingsTuples(deviceId)) || {};
			refs.displayValue.textContent = cardFields.display || 'Unknown';
			refs.resolutionValue.textContent = cardFields.resolution || 'Unknown';
			refs.ndiStatusValue.textContent = cardFields.ndiStatus || 'Unknown';
			refs.versionValue.textContent = cardFields.version || 'Unknown';

			const showStats = !!(dev.systemStats && dev.status === 'online');
			refs.stats.style.display = showStats ? '' : 'none';
			if (showStats) {
				const cpuColor = dev.systemStats.cpu > 80 ? '#f87171' : dev.systemStats.cpu > 50 ? '#fbbf24' : '#4ade80';
				const tempColor = dev.systemStats.temperature > 70 ? '#f87171' : dev.systemStats.temperature > 55 ? '#fbbf24' : '#4ade80';
				const memColor = dev.systemStats.memory.percent > 80 ? '#f87171' : dev.systemStats.memory.percent > 50 ? '#fbbf24' : '#4ade80';
				const tempF = ((dev.systemStats.temperature * 9 / 5) + 32).toFixed(0);
				refs.cpu.textContent = `${dev.systemStats.cpu}%`;
				refs.cpu.style.color = cpuColor;
				refs.temp.textContent = `${tempF}°F`;
				refs.temp.style.color = tempColor;
				refs.mem.textContent = `${dev.systemStats.memory.percent}%`;
				refs.mem.style.color = memColor;
				refs.fan.textContent = (typeof dev.systemStats.fan === 'number' && dev.systemStats.fan > 0) ? `${dev.systemStats.fan} RPM` : '0 RPM';
			}

			if (account.isAdmin) {
				refs.removeButton.style.display = '';
				refs.removeButton.onclick = (e) => { e.stopPropagation(); removeDeviceFromGroup(deviceId, dev.name); };
			} else {
				refs.removeButton.style.display = 'none';
			}
		}

		// Patch a single already-rendered tile in place -- used by the relay
		// callbacks below so a message about one device doesn't touch every
		// other card's DOM (createGroupDeviceTile()/removal/reordering are
		// only relevant when the *set* of devices in the group changes, not
		// when one device's stats/source update).
		function patchGroupDeviceTile(deviceId) {
			if (!group) return;
			const dev = group.devices.find(d => (d.id || d.deviceId) === deviceId);
			const refs = groupDeviceTiles.get(deviceId);
			if (dev && refs) { updateGroupDeviceTile(refs, dev); }
		}

		function updateDevicesList() {
			const container = document.getElementById('devicesContainer');
			if (!container) return;

			const emptyMsg = container.querySelector('.no-devices-msg');
			if (group.devices.length === 0) {
				groupDeviceTiles.forEach((refs) => refs.root.remove());
				groupDeviceTiles.clear();
				if (!emptyMsg) { container.innerHTML = '<p class="no-devices-msg" style="color:#888;">No devices in this group</p>'; }
				return;
			}
			if (emptyMsg) { emptyMsg.remove(); }

			const seenIds = new Set();
			let prevRoot = null;

			group.devices.forEach(dev => {
				const deviceId = dev.id || dev.deviceId;
				seenIds.add(deviceId);

				let refs = groupDeviceTiles.get(deviceId);
				if (!refs) {
					refs = createGroupDeviceTile(dev);
					groupDeviceTiles.set(deviceId, refs);
					container.appendChild(refs.root);
				}
				updateGroupDeviceTile(refs, dev);

				const desiredNext = prevRoot ? prevRoot.nextSibling : container.firstChild;
				if (desiredNext !== refs.root) { container.insertBefore(refs.root, desiredNext); }
				prevRoot = refs.root;
			});

			for (const [id, refs] of groupDeviceTiles) {
				if (!seenIds.has(id)) {
					refs.root.remove();
					groupDeviceTiles.delete(id);
				}
			}
		}

		function renderGroup() {
			updateGroupHeaderStats();

			// Build source grid
			let admAddDeviceButtonHtml = '';
			let admGroupActionGroupHtml = '';
			let rokuActionButtons = '';

			/*	moved to append children elements

			const sourceGrid = sources.length > 0 ? sources.map(s => {

		// Star-button toggle on a source card -- adds/removes it from the

		// toggle). Updates this card's button immediately from the
		// server's authoritative response, and patches the matching entry
		// in `sources` so a later renderGroup() stays consistent.
		async function toggleFavoriteSource(btnEl, name, url) {
			btnEl.disabled = true;
			try {
				const res = await fetch('/api/v2/favorite-ndi-sources/toggle', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ name, url }),
				});
				if (res.ok) {
					const data = await res.json();
					const src = sources.find(s => s.name === name);
					if (src) { src.favorite = data.favorite; }
					btnEl.classList.toggle('favorited', data.favorite);
					btnEl.title = data.favorite ? 'Remove from favorites' : 'Add to favorites';
					toast.success(data.favorite ? 'Added to favorites' : 'Removed from favorites');
				} else {
					toast.error('Failed to update favorite');
				}
			} catch (e) {
				toast.error('Error updating favorite');
			} finally {
				btnEl.disabled = false;
			}
		}

		/**
		 *  'No Source Display' -- replaces the old dedicated Display
		 *  Overlay/Blank Display buttons, which both just wrote
		 *  'ndpi_status_no_source_display_mode' to 'overlay'/'blank' on
		 *  every device in the group anyway (see hub_api_server.js's
		 *  groupCommandRoute('overlay'/'blank', ...)). Options are sourced
		 *  from whatever any one device in the group reports for that
		 *  setting (same static schema for every device running the same
		 *  Client version) rather than hardcoded.
		 */
		function renderGroupNoSourceDisplayControl() {
			const select = document.getElementById('groupNoSourceDisplaySelect');
			if (!select || !group) return;

			let setting = null;
			for (const dev of group.devices) {
				const tuples = getDeviceSettingsTuples(dev.id || dev.deviceId);
				if (!Array.isArray(tuples)) continue;
				const entry = tuples.find(([k]) => k === 'ndpi_status_no_source_display_mode');
				if (entry) { setting = entry[1]; break; }
			}

			if (!setting || !Array.isArray(setting.options) || setting.options.length === 0) {
				select.innerHTML = '';
				select.disabled = true;
				return;
			}

			select.disabled = false;
			select.innerHTML = setting.options.map(([label, value]) =>
				`<option value="${value}" ${value === setting.value ? 'selected' : ''}>${label}</option>`
			).join('');
		}

		/**
		 *  Group Device Settings -- every `allowEditExternal` setting
		 *  reported by any device in this group (same fields device.html's
		 *  own renderSettings() shows for one device), aggregated across
		 *  every device. Editing a field here writes it to every device in
		 *  the group (POST /api/v2/group/:groupId/setting, fans out the
		 *  same 'set-setting' command deviceCommandRoute('setting') sends
		 *  per-device). When devices disagree on a field's value, the
		 *  control is left unselected/blank and a warning + per-value
		 *  breakdown + "Sync" button are shown instead.
		 */
		// Fields already covered by dedicated controls elsewhere on this
		// page (device_name has no per-device rename control here at all;
		// media_overlay_image is a large per-device image blob with no
		// group-level control; ndpi_status_no_source_display_mode has the
		// dedicated dropdown above) -- same exclusion list device.html's
		// renderSettings() uses, for the same reasons.
		const GROUP_SETTINGS_EXCLUDED = ['device_name', 'media_overlay_image', 'ndpi_status_no_source_display_mode'];
		// output_display_* fields describe whatever physical display happens
		// to be plugged into that specific device (manufacturer, model,
		// resolution, etc) -- legitimately different per device, not
		// something that makes sense to flag as a "mismatch" or sync across
		// a group.
		const GROUP_SETTINGS_EXCLUDED_PREFIXES = ['output_display_'];
		const isGroupSettingExcluded = (key) => GROUP_SETTINGS_EXCLUDED.includes(key) || GROUP_SETTINGS_EXCLUDED_PREFIXES.some((prefix) => key.startsWith(prefix));

		// Prefer the live per-device settings relay (devicesSystemRelay,
		// pushed the instant a device's settings change) over the Hub-relay
		// snapshot on `dev.settings` (only refreshed on the ~5s client-status
		// cadence / whenever /ws devices-update fires), falling back to the
		// latter when the relay hasn't delivered anything for a device yet.
		function getDeviceSettingsTuples(deviceId) {
			const relayed = devicesSystemRelay && devicesSystemRelay.cache[deviceId];
			if (Array.isArray(relayed)) return relayed;
			const dev = group.devices.find(d => (d.id || d.deviceId) === deviceId);
			return (dev && Array.isArray(dev.settings)) ? dev.settings : null;
		}

		// key -> { obj: <setting definition, incl. group/options>, perDevice: Map<deviceId, {name, value}> }
		function collectGroupSettings() {
			const fieldMap = new Map();
			(group.devices || []).forEach(dev => {
				const deviceId = dev.id || dev.deviceId;
				const tuples = getDeviceSettingsTuples(deviceId);
				if (!Array.isArray(tuples)) return;
				tuples.forEach(([key, obj]) => {
					if (!obj || !obj.allowEditExternal) return;
					if (isGroupSettingExcluded(key)) return;
					if (!fieldMap.has(key)) { fieldMap.set(key, { obj, perDevice: new Map() }); }
					fieldMap.get(key).perDevice.set(deviceId, { name: dev.name, value: obj.value });
				});
			});
			return fieldMap;
		}

		function formatSettingValue(obj, value) {
			if (Array.isArray(obj.options)) {
				const match = obj.options.find(([, v]) => v === value);
				if (match) return match[0];
			}
			return (value === '' || value === undefined || value === null) ? '(empty)' : String(value);
		}

		let lastRenderedGroupSettingsJSON = null;

		function renderGroupSettings() {
			const grid = document.getElementById('groupSettingsGrid');
			if (!grid || !group) return;

			const fieldMap = collectGroupSettings();

			// Skip rebuilding when nothing actually changed (mirrors
			// device.html's own lastRenderedSettingsJSON guard) so an
			// in-progress edit isn't wiped out by an unrelated relay tick.
			const snapshotJSON = JSON.stringify(Array.from(fieldMap.entries()).map(([key, { obj, perDevice }]) =>
				[key, obj.group, obj.options, Array.from(perDevice.entries())]
			));
			if (snapshotJSON === lastRenderedGroupSettingsJSON) return;
			lastRenderedGroupSettingsJSON = snapshotJSON;

			if (fieldMap.size === 0) {
				grid.innerHTML = '<p class="info-grid-message">No editable settings reported by devices in this group yet.</p>';
				return;
			}

			const groupLabel = (name) => name.split('_').join(' ').replace(/\w\S*/g, (w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());

			// Same field-grouping-by-obj.group convention device.html's
			// renderSettings() uses.
			const byGroup = new Map();
			fieldMap.forEach((entry, key) => {
				const groupKey = entry.obj.group || 'Other';
				if (!byGroup.has(groupKey)) { byGroup.set(groupKey, []); }
				byGroup.get(groupKey).push([key, entry]);
			});

			grid.innerHTML = Array.from(byGroup.entries()).map(([groupKey, fields]) => {
				const fieldsHtml = fields.map(([key, { obj, perDevice }]) => {
					const label = key.split('_').join(' ');
					const byValue = new Map(); // value -> [deviceName, ...]
					perDevice.forEach(({ name, value }) => {
						if (!byValue.has(value)) { byValue.set(value, []); }
						byValue.get(value).push(name);
					});
					const mismatched = byValue.size > 1;

					let control;
					if (Array.isArray(obj.options) && obj.options.length > 0) {
						const optionsHtml = obj.options.map(([k, v]) => `<option value="${v}" ${!mismatched && v === obj.value ? 'selected' : ''}>${k}</option>`).join('');
						control = `<select class="mono" data-setting="${key}" onchange="saveGroupSetting('${key}', this.value)">` +
							(mismatched ? `<option value="" selected disabled>— Mixed Values —</option>` : '') +
							optionsHtml +
							`</select>`;
					} else {
						const displayValue = mismatched ? '' : String(obj.value ?? '').replace(/"/g, '&quot;');
						const placeholder = mismatched ? 'Mixed values -- enter a value to overwrite the whole group' : '';
						control = `<input type="text" class="mono" data-setting="${key}" value="${displayValue}" placeholder="${placeholder}" onchange="saveGroupSetting('${key}', this.value)">`;
					}

					let warningHtml = '';
					if (mismatched) {
						// Grouped by distinct value, not by device -- a
						// majority sharing one value plus a single outlier
						// only lists that outlier's value once, instead of
						// the shared value repeated per device that has it.
						const listHtml = Array.from(byValue.entries()).map(([value, names]) =>
							`<li><span class="mono">${formatSettingValue(obj, value)}</span> — ${names.join(', ')}</li>`
						).join('');
						warningHtml = `
							<div class="settings-mismatch">
								<div class="settings-mismatch-message">This setting doesn't match across all devices in the group.</div>
								<ul class="settings-mismatch-list">${listHtml}</ul>
								<button type="button" class="button-subtle" onclick="syncGroupSetting('${key}')">Sync</button>
							</div>
						`;
					}

					return `
						<div class="info-item${mismatched ? ' settings-mismatch-item' : ''}">
							<span class="info-label">${label}</span>
							<span class="info-value">${control}</span>
							${warningHtml}
						</div>
					`;
				}).join('');

				return `
					<div style="grid-column:1/-1;font-size: 0.8rem;text-transform:uppercase;color:#aaa;font-weight:600;border-bottom: 0.0625rem solid var(--border);margin-top: 0.5rem;padding-left: 0.5rem;padding-bottom: 0.1rem;">${groupLabel(groupKey)}</div>
					${fieldsHtml}
				`;
			}).join('');
		}

		async function saveGroupSetting(name, value) {
			try {
				const res = await fetch(`/api/v2/group/${group.id}/setting`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ name, value })
				});
				if (res.ok) {
					toast.success(`Updated ${name.split('_').join(' ')} for all devices in this group`);
				} else {
					toast.error(`Failed to update ${name.split('_').join(' ')}`);
				}
			} catch (e) {
				toast.error('Error updating setting');
			}
		}

		// "Sync" -- lets the admin pick one of the currently differing
		// values (labeled with which device(s) already have it, mirroring
		// addDevicesToGroup()'s own device-picker modal.select() usage) and
		// applies it to every device in the group.
		async function syncGroupSetting(key) {
			const fieldMap = collectGroupSettings();
			const entry = fieldMap.get(key);
			if (!entry) return;

			const byValue = new Map();
			entry.perDevice.forEach(({ name, value }) => {
				if (!byValue.has(value)) { byValue.set(value, []); }
				byValue.get(value).push(name);
			});

			const options = Array.from(byValue.entries()).map(([value, names]) => ({
				value,
				label: `${formatSettingValue(entry.obj, value)} (${names.join(', ')})`
			}));

			const label = key.split('_').join(' ');
			const chosen = await modal.select(`Select the value to sync "${label}" to across all devices in this group:`, options, null, 'Sync Setting');
			if (chosen === null || chosen === undefined) return;

			await saveGroupSetting(key, chosen);
		}

		async function shutdownGroup() {
			const confirmed = await modal.confirm(
				`Are you sure you want to shutdown all ${group.devices.length} device(s) in this group?`,
				'Shutdown Group',
				{ danger: true, confirmText: 'Shutdown All' }
			);
			if (!confirmed) return;

			try {
				const res = await fetch(`/api/group/${group.id}/shutdown`, { method: 'POST' });
				if (res.ok) {
					toast.info('Shutdown command sent to group');
				} else {
					toast.error('Failed to send shutdown command to group');
				}
			} catch (e) {
				toast.error('Error sending shutdown command to group');
			}
		}

		async function rebootGroup() {
			const confirmed = await modal.confirm(
				`Are you sure you want to reboot all ${group.devices.length} device(s) in this group?`,
				'Reboot Group',
				{ danger: true, confirmText: 'Reboot All' }
			);
			if (!confirmed) return;

			try {
				const res = await fetch(`/api/group/${group.id}/reboot`, { method: 'POST' });
				if (res.ok) {
					toast.info('Reboot command sent to group');
				} else {
					toast.error('Failed to send reboot command to group');
				}
			} catch (e) {
				toast.error('Error sending reboot command to group');
			}
		}

		async function removeDeviceFromGroup(deviceId, deviceName) {
			const confirmed = await modal.confirm(
				`Remove "${deviceName}" from this group?`,
				'Remove Device',
				{ danger: true, confirmText: 'Remove' }
			);
			if (!confirmed) return;

			try {
				const res = await fetch(`/api/group/${group.id}/remove-device`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ deviceId })
				});

				if (res.ok) {
					// Update local state and refresh display
					group.devices = group.devices.filter(d => (d.id || d.deviceId) !== deviceId);
					updateGroupHeaderStats();
					updateDevicesList();
					toast.success('Device removed from group');
				} else {
					toast.error('Failed to remove device');
				}
			} catch (e) {
				toast.error('Error removing device');
			}
		}

		// Roku TV control functions
		async function powerDisplaysInGroup(action) {
			if (groupRokuTvs.length === 0) {
				toast.warning('No Roku TVs configured for this group');
				return;
			}

			const ipAddresses = groupRokuTvs.map(tv => tv.ipAddress);
			await rokuBulkKeypress(ipAddresses, action);

			toast.info(`Sent ${action} command to ${groupRokuTvs.length} Roku TV(s)`);
		}

		async function addDevicesToGroup() {
			try {
				// Get all devices from the server
				const devRes = await fetch('/api/devices');
				const devData = await devRes.json();
				const allDevs = devData.devices || [];

				// Filter out devices already in this group
				const groupDeviceIds = group.devices.map(d => d.id || d.deviceId);
				const availableDevices = allDevs.filter(device =>
					!groupDeviceIds.includes(device.id || device.deviceId)
				);

				if (availableDevices.length === 0) {
					toast.warning('No available devices to add');
					return;
				}

				// Create options list with value/label
				const options = availableDevices.map(device => ({
					value: device.id || device.deviceId,
					label: `${device.name} (${device.ip})`
				}));

				const selectedDeviceId = await modal.select('Select a device to add to this group:', options, null, 'Add Device');
				if (selectedDeviceId === null || selectedDeviceId === undefined) return;

				// Add device to group via API
				const res = await fetch(`/api/group/${group.id}/add-device`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ deviceId: selectedDeviceId })
				});

				if (res.ok) {
					toast.success('Device added to group');
					// WebSocket will update the group, triggering updateGroupDisplay
				} else {
					toast.error('Failed to add device to group');
				}
			} catch (e) {
				console.error('Error adding device to group:', e);
				toast.error('Error adding device to group');
			}
		}

		async function renameGroup() {
			const newName = await modal.prompt('Enter new group name:', group.name, 'Rename Group');
			if (!newName || newName === group.name) return;

			try {
				const res = await fetch(`/api/group/${group.id}`, {
					method: 'PUT',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ name: newName })
				});
				if (res.ok) {
					group.name = newName;
					document.getElementById('groupName').textContent = newName;
					toast.success('Group renamed');
				} else {
					toast.error('Failed to rename group');
				}
			} catch (e) {
				toast.error('Error renaming group');
			}
		}

		async function deleteGroup() {
			const confirmed = await modal.confirm(
				`Are you sure you want to delete the group "${group.name}"? This action cannot be undone.`,
				'Delete Group',
				{ danger: true, confirmText: 'Delete', cancelText: 'Cancel' }
			);

			if (!confirmed) return;

			try {
				const res = await fetch(`/api/group/${group.id}`, { method: 'DELETE' });

				if (res.ok) {
					toast.success('Group deleted');
					setTimeout(() => window.location.href = '/groups.html', 500);
				} else {
					toast.error('Failed to delete group');
				}
			} catch (e) {
				console.error('Error deleting group:', e);
				toast.error('Error deleting group');
			}
		}

		loadGroup();

		// Initialize WebSocket connection
		const ws = initWebSocket();

		// Handle groups updates from WebSocket - only update display, don't rebuild
		ws.onGroupsUpdate = (groupList) => {
			const updatedGroup = groupList.find(g => g.id === group?.id);
			if (updatedGroup) {
				// Preserve enriched device data
				const enrichedDevices = group.devices;
				group = { ...group, ...updatedGroup };
				// Re-enrich with device data
				group.devices = group.devices.map(gDev => {
					const fullDevice = allDevices.find(d => (d.id || d.deviceId) === (gDev.id || gDev.deviceId));
					return fullDevice ? { ...gDev, ...fullDevice } : gDev;
				});
				updateGroupDisplay();
			}
		};

		/**
		 *  NDI source list -- a direct connection to the Hub's own
		 *  /ws/sources (same origin, not a per-device socket) instead of a
		 *  message type on the shared /ws GUI socket. Mirrors exactly how
		 *  Client__v3_1_0's own local system.js UI gets its source list:
		 *  the Hub keeps a long-running `ndpi_discover` subprocess going
		 *  and pushes its output straight through on connect (a snapshot,
		 *  favorites already merged in) and again every time the process
		 *  reports a change -- no polling, no separate periodic broadcast.
		 */
		let sourcesSocket = null;
		let sourcesReconnectTimer = null;
		function connectSourcesSocket() {
			const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
			sourcesSocket = new WebSocket(`${protocol}//${window.location.host}/ws/sources`);

			sourcesSocket.onmessage = (event) => {
				try {
					const sourcesUpdate = JSON.parse(event.data);
					if (Array.isArray(sourcesUpdate) && JSON.stringify(sources) !== JSON.stringify(sourcesUpdate)) {
						sources = sourcesUpdate;
						// Guard needed here (unlike the shared /ws GUI socket's old
						// ~10s-interval delivery, this dedicated connection can
						// deliver its cached snapshot within milliseconds of
						// connecting -- comfortably possible before loadGroup()'s
						// own fetch has resolved).
						if (group) { renderGroup(); }
					}
				} catch (e) {
					console.error('Invalid /ws/sources message:', e);
				}
			};
			sourcesSocket.onclose = () => {
				clearTimeout(sourcesReconnectTimer);
				sourcesReconnectTimer = setTimeout(connectSourcesSocket, 5000);
			};
			sourcesSocket.onerror = () => { };
		}
		connectSourcesSocket();

		// Handle device updates from WebSocket - update device stats without page reload
		ws.onDevicesUpdate = (devices) => {
			allDevices = devices;
			if (group) {
				// Update group devices with latest data (preserves scroll position).
				// Keep the freshest systemStats we already have (kept live by
				// devicesStatsRelay, ~1s cadence) instead of letting this ~5s Hub
				// snapshot overwrite it with a staler copy -- otherwise stats
				// visibly flash between two different values on every relay tick.
				group.devices = group.devices.map(gDev => {
					const fullDevice = devices.find(d => (d.id || d.deviceId) === (gDev.id || gDev.deviceId));
					return fullDevice ? { ...gDev, ...fullDevice, systemStats: gDev.systemStats || fullDevice.systemStats } : gDev;
				});
				updateGroupHeaderStats(); // keeps the "Online" pill current as device status changes
				updateDevicesList();
			}
		};

		/**
		 *  Multi-device relay — one Hub connection covers every device
		 *  tile's live stats/settings instead of waiting on the ~5s
		 *  Hub-relayed client-status cadence (see 01-scripts/ws-devices.js).
		 */
		const devicesStatsRelay = new NDPiDevicesRelay('stats', (cache, changedIds) => {
			if (!group) return;
			// changedIds === null only on the initial snapshot/reconnect,
			// where every device is "new" and needs a full render; otherwise
			// it's exactly the devices that changed this tick, so only their
			// tiles get touched.
			const idsToApply = changedIds === null ? Object.keys(cache) : changedIds;
			let changed = false;
			idsToApply.forEach((id) => {
				const dev = group.devices.find(d => (d.id || d.deviceId) === id);
				const stats = cache[id];
				if (dev && stats) { dev.systemStats = stats; changed = true; }
			});
			if (!changed) return;
			if (changedIds === null) { updateDevicesList(); }
			else { changedIds.forEach(patchGroupDeviceTile); }
		});

		const devicesSystemRelay = new NDPiDevicesRelay('system', (cache, changedIds) => {
			if (!group) return;
			const idsToApply = changedIds === null ? Object.keys(cache) : changedIds;
			let groupDeviceTouched = false;
			idsToApply.forEach((id) => {
				const dev = group.devices.find(d => (d.id || d.deviceId) === id);
				if (!dev) return;
				groupDeviceTouched = true;
				const currentSource = getRelayedSetting(cache[id], 'ndpi_status_ndi_source_target');
				if (currentSource) { dev.currentSource = currentSource.value || 'None'; }
			});
			if (!groupDeviceTouched) return;
			// Every relayed settings tuple (not just currentSource) feeds a
			// tile's Display/Resolution/NDI Status/Version fields, the No
			// Source Display dropdown, and the Device Settings grid -- all
			// have their own no-op/diff guards, so it's safe to call on
			// every tick that touched a device in this group.
			if (changedIds === null) { updateDevicesList(); }
			else { changedIds.forEach(patchGroupDeviceTile); }
			renderGroupNoSourceDisplayControl();
			renderGroupSettings();
		});

		window.addEventListener('beforeunload', () => {
			devicesStatsRelay.close();
			devicesSystemRelay.close();
			clearTimeout(sourcesReconnectTimer);
			try { sourcesSocket && sourcesSocket.close(); } catch (e) { }
		});

	</script>
