		<section class="dashboard">
			<div class="card" style="grid-column: 1 / -1;">
				<h2>Device Groups</h2>
				<div class="card-content">
					<div class="devices-grid" id="groupsList"></div>
					
					<!-- No Groups Message -->
					<div id="noGroupsMessage" style="text-align: center; padding: 2.5rem; color: #888; display: none;">
						<p>No groups created yet</p>
						<p style="font-size: 0.875rem; margin-top: 0.5rem;">Click the "+" button to create your first group</p>

		<!-- Floating Action Button -->
		<div class="floating-actions">
			<button class="fab" id="add-button" title="Create Group">
				<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-lg" viewBox="0 0 16 16">
					<path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/>
				</svg>
			</button>

			</div>

	<script src="/scripts/functions.js"></script>
	<script>

		if (document.addEventListener) {

		(() => {
			applyActiveNav('navGroups');
		})();
		
		/*
		// Redirect to set PIN if first time login
		if (account.firstTimeLogin) {
			sessionStorage.setItem('signin_return', window.location.pathname);
			window.location.href = '/set-pin.html';
		}

		// Display account name
		//document.getElementById('navAccount').textContent = account.firstName;

		// Initialize UI scale from saved setting
		const savedScale = localStorage.getItem('ndpi_ui_scale') || '100';
		const scaleDecimal = savedScale / 100;
		document.body.style.zoom = scaleDecimal;
		if (!document.body.style.zoom) {
			document.body.style.transform = `scale(${scaleDecimal})`;
			document.body.style.transformOrigin = 'top left';
		}
		*/

		// Global variables
		let groups = [];

		document.getElementById('add-button').addEventListener('click', () => {
			this.onclick = null;
			showCreateGroupModal();
		});

		// Fetch Groups
		async function fetchGroups() {
			try {
				const res = await fetch('/api/groups');
				const data = await res.json();
				groups = data.groups || [];
				renderGroups();
			} catch (e) {
				groups = [];
				renderGroups();
			}
		}

		// Render Groups (patch existing tiles in place instead of rebuilding)
		const groupTiles = new Map(); // groupId -> tile refs

		function createGroupTile() {
			const tile = document.createElement('div');
			tile.className = 'group-tile';
			tile.innerHTML = `
				<h2 style='flex: 1;'></h2>
				<div class="group-devices" style="flex: 1; text-align: center;"></div>
				<div style="font-size:100%; overflow:hidden; flex: 3; text-align: right; max-width: 100%; display: flex; flex-direction: column; gap: 5px;">
					<font style="color:#888; text-align: right;">
						Current Source
					</font>
					<font class="mono"></font>
				</div>
			`;
			return {
				root: tile,
				name: tile.querySelector('h2'),
				deviceCount: tile.querySelector('.group-devices'),
				source: tile.querySelector('font.mono'),
			};
		}

		function updateGroupTile(refs, group) {
			refs.name.textContent = group.name;
			const deviceCount = group.devices ? group.devices.length : 0;
			refs.deviceCount.textContent = deviceCount === 1 ? '1 device' : `${deviceCount} devices`;
			refs.source.textContent = (!group.currentSource || String(group.currentSource).toLowerCase() === 'none') ? 'None' : group.currentSource;
			refs.root.onclick = () => window.location.href = `/group.html?id=${encodeURIComponent(group.id)}`;
		}

		function renderGroups() {
			const list = document.getElementById('groupsList');
			const noGroupsMsg = document.getElementById('noGroupsMessage');

			if (groups.length === 0) {
				groupTiles.forEach((refs) => refs.root.remove());
				groupTiles.clear();
				noGroupsMsg.style.display = 'block';
				return;
			}

			noGroupsMsg.style.display = 'none';

			const seenIds = new Set();
			let prevRoot = null;

			groups.forEach(group => {
				seenIds.add(group.id);
				let refs = groupTiles.get(group.id);
				if (!refs) {
					refs = createGroupTile();
					groupTiles.set(group.id, refs);
					list.appendChild(refs.root);
				}
				updateGroupTile(refs, group);

				const desiredNext = prevRoot ? prevRoot.nextSibling : list.firstChild;
				if (desiredNext !== refs.root) { list.insertBefore(refs.root, desiredNext); }
				prevRoot = refs.root;
			});

			for (const [id, refs] of groupTiles) {
				if (!seenIds.has(id)) {
					refs.root.remove();
					groupTiles.delete(id);
				}
			}
		}

		// Create Group Modal
		const showCreateGroupModal = async () => {
			const name = await modal.prompt('Enter new group name:', '', 'Create Group', { placeholder: 'Group name' });
			if (!name) return;
			try {
				const res = await fetch('/api/group', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ name, devices: [] })
				});
				if (res.ok) {
					await fetchGroups();
					toast.success('Group created');
				} else {
					toast.error('Failed to create group');
				}
			} catch (e) {
				toast.error('Error creating group');
			}
		};

		// Initialize WebSocket connection
		const ws = initWebSocket();


		// Handle groups updates from WebSocket
		ws.onGroupsUpdate = (groupList) => {
			groups = groupList;
			renderGroups();
		};

		// Initial load
		fetchGroups();

	</script>
</body>
